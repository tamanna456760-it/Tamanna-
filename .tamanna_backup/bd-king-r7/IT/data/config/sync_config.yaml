# config/sync_config.yaml
system:
  name: "full-auto-sync-build"
  version: "1.0.0"
  log_level: "INFO"

sync:
  watch_paths:
    - "./src"
    - "./config"
    - "./scripts"
  ignore_patterns:
    - "*.tmp"
    - "*.log"
    - "node_modules/"
    - "__pycache__/"
    - ".git/"
  sync_interval: 1.0
  use_compression: true

build:
  languages:
    python:
      build_command: "python -m pip install -r requirements.txt && python -m pytest"
      test_command: "python -m pytest"
      output_dir: "./dist"
    javascript:
      build_command: "npm install && npm run build"
      test_command: "npm test"
      output_dir: "./dist"
    docker:
      build_command: "docker build -t ${IMAGE_NAME} ."
      test_command: "docker run ${IMAGE_NAME} test"
  triggers:
    - type: "file_change"
    - type: "time_based"
      schedule: "0 2 * * *" # Daily at 2 AM
    - type: "manual"

environments:
  local:
    path: "./local_build"
    auto_deploy: true
  staging:
    host: "staging.example.com"
    path: "/var/www/staging"
    username: "deploy"
    auto_deploy: false
  production:
    host: "prod.example.com"
    path: "/var/www/production"
    username: "deploy"
    auto_deploy: false

notifications:
  email:
    enabled: false
    smtp_server: "smtp.example.com"
    recipients:
      - "dev@example.com"
  slack:
    enabled: true
    webhook_url: "${SLACK_WEBHOOK_URL}"
  webhook:
    enabled: true
    url: "https://ci.example.com/webhook"

monitoring:
  health_check_interval: 30
  performance_metrics: true
  log_retention_days: 30
