name: Full Quick Fix Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      run_all_checks:
        description: 'Run all security & lint checks'
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # LINT & VALIDATION
  # ==========================================
  lint:
    name: 🔍 Lint & Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 💾 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 💾 Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-lint-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 🔧 Install Python linting tools
        if: hashFiles('requirements.txt') != ''
        run: |
          pip install --upgrade pip
          pip install flake8 black isort pylint

      - name: 🎨 Run Black (code formatter check)
        if: hashFiles('**/*.py') != ''
        run: black --check . || true

      - name: 📝 Run Flake8 (linter)
        if: hashFiles('**/*.py') != ''
        run: flake8 . --count --show-source --statistics || true

      - name: 📋 Run isort (import sorter check)
        if: hashFiles('**/*.py') != ''
        run: isort --check-only . || true

      - name: 🐚 ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find . -name "*.sh" -exec shellcheck {} \; || true

      - name: 📊 Lint Summary
        if: always()
        run: |
          echo "## 🔍 Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Python code formatting checked" >> $GITHUB_STEP_SUMMARY
          echo "✅ Shell scripts validated" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # BUILD & TEST
  # ==========================================
  build-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Python Setup
      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 💾 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-py${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
            ${{ runner.os }}-pip-

      - name: 📦 Install Python dependencies
        if: hashFiles('requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist

      - name: 🧪 Run Python tests
        if: hashFiles('tests/**/*.py') != '' || hashFiles('test_*.py') != ''
        run: |
          pytest -v --cov=. --cov-report=xml --cov-report=html --maxfail=3 || true

      # Node Setup
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 💾 Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: 📦 Install Node dependencies
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: 🧪 Run Node tests
        if: hashFiles('package.json') != ''
        run: npm test || true

      - name: 🏗️ Build Node project
        if: hashFiles('package.json') != ''
        run: npm run build || true

      # Upload artifacts
      - name: 📤 Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7
        if: always()

  # ==========================================
  # SECURITY SCAN
  # ==========================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    if: github.event.inputs.run_all_checks != 'false'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 💾 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 🛡️ Install security tools
        run: |
          pip install --upgrade pip
          pip install bandit safety

      - name: 🔐 Run Bandit (Python security scan)
        if: hashFiles('**/*.py') != ''
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . || true

      - name: ⚠️ Check dependencies with Safety
        if: hashFiles('requirements.txt') != ''
        run: |
          safety check --file requirements.txt || true

      - name: 🔎 Run CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python,javascript

      - name: 🔍 CodeQL Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: 📊 CodeQL Analyze
        uses: github/codeql-action/analyze@v3

      - name: 📤 Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 7
        if: always()

  # ==========================================
  # FINALIZE & SUMMARY
  # ==========================================
  finalize:
    name: 🚀 Final Build Summary
    runs-on: ubuntu-latest
    needs: [lint, build-test, security]
    if: always()

    steps:
      - name: 📊 Generate Summary Report
        shell: bash
        run: |
          echo "## 🚀 Tamanna CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY

          LINT_STATUS="${{ needs.lint.result }}"
          BUILD_STATUS="${{ needs.build-test.result }}"
          SECURITY_STATUS="${{ needs.security.result }}"

          echo "| 🔍 Lint | $LINT_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ Build & Test | $BUILD_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔒 Security Scan | $SECURITY_STATUS |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status logic
          if [[ "$LINT_STATUS" == "failure" || "$BUILD_STATUS" == "failure" || "$SECURITY_STATUS" == "failure" ]]; then
            echo "❌ **Pipeline Result: FAILED**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ Issues Found" >> $GITHUB_STEP_SUMMARY
            [ "$LINT_STATUS" == "failure" ] && echo "- Linting issues detected" >> $GITHUB_STEP_SUMMARY
            [ "$BUILD_STATUS" == "failure" ] && echo "- Build or test failures" >> $GITHUB_STEP_SUMMARY
            [ "$SECURITY_STATUS" == "failure" ] && echo "- Security vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **Pipeline Result: SUCCESS**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All checks passed! Ready for deployment." >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🔔 Slack notification (on failure)
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: '#alerts'
          SLACK_COLOR: '#FF0000'
          SLACK_TITLE: 'CI/CD Pipeline Failed'
          SLACK_MESSAGE: |
            Pipeline failed for ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true
