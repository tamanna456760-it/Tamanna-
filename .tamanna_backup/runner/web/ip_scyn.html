<!DOCTYPE html>
<html>
<head>
  <title>IP Sync</title>
</head>
<body style="background:black; color:#0f0; font-family:monospace; padding:20px;">

<h2>🌐 IP SYNC SYSTEM</h2>

<p id="ip">Loading IP...</p>

<script>
  function getIP() {
    fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .then(data => {
        document.getElementById("ip").innerText =
          "Your IP: " + data.ip;
      })
      .catch(() => {
        document.getElementById("ip").innerText =
          "Failed to fetch IP ❌";
      });
  }

  // Auto sync every 5 seconds
  setInterval(getIP, 5000);

  // First load
  getIP();
</script>

</body>
</html>
