
name: Tamanna AI Build and Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "Main.py"
      - "requirements.txt"
      - "tamanna_ai/**"
      - "modules/**"
      - ".github/workflows/tamanna-build.yml"

permissions:
  contents: read

concurrency:
  group: tamanna-ai-build
  cancel-in-progress: false

jobs:
  build:
    name: Build and Test Tamanna AI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn
          if [ -f requirements.txt ]; then
            echo "Checking project requirements..."
            python -m pip install -r requirements.txt
          fi

      - name: Check Required Files
        run: |
          test -f main.py
          test -f Main.py
          echo "PASS: main.py exists"
          echo "PASS: Main.py exists"

      - name: Compile Python Files
        run: |
          python -m py_compile main.py Main.py
          echo "PASS: Python syntax check"

      - name: Import Tamanna AI
        run: |
          python -c "import main; print('PASS: main.py imported')"
          python -c "from Main import app; print('PASS: FastAPI app loaded:', app.title)"

      - name: Start Tamanna AI Server
        env:
          HOST: 127.0.0.1
          PORT: "8000"
        run: |
          python main.py > tamanna-server.log 2>&1 &
          echo $! > tamanna-server.pid

      - name: Test API
        run: |
          python - <<'PY'
          import time
          import urllib.request
          import json

          url = "http://127.0.0.1:8000/openapi.json"

          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=3) as response:
                      assert response.status == 200
                      api = json.loads(response.read().decode())
                      print("PASS: HTTP server responded")
                      print("API title:", api.get("info", {}).get("title"))
                      print("API paths:", len(api.get("paths", {})))
                      break
              except Exception as error:
                  if attempt == 29:
                      print("FAIL:", repr(error))
                      raise
                  time.sleep(1)
          PY

      - name: Upload Server Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-ai-build-logs
          path: tamanna-server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Temporary Server
        if: always()
        run: |
          if [ -f tamanna-server.pid ]; then
            kill "$(cat tamanna-server.pid)" 2>/dev/null || true
          fi
          if [ -f tamanna-server.log ]; then
            cat tamanna-server.log
          fi
