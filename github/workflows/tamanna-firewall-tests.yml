name: Tamanna AI Firewall Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firewall-tests:
    name: Run Firewall Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
      - name: Validate firewall configuration
        run: |
          python -c "import json; json.load(open('firewall/firewall_config.json'))"
      - name: Run firewall tests
        run: |
          python -m firewall.run_tests