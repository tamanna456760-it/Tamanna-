<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Detector AI</title>

    <style>
        body{
            font-family:Arial,Helvetica,sans-serif;
            background:#f4f4f4;
            text-align:center;
            margin:0;
            padding:40px;
        }

        .container{
            max-width:700px;
            margin:auto;
            background:#fff;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,.15);
        }

        h1{
            color:#333;
        }

        input[type=file]{
            margin:20px;
        }

        button{
            padding:12px 25px;
            border:none;
            border-radius:6px;
            background:#007BFF;
            color:#fff;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#0056b3;
        }

        img{
            max-width:100%;
            margin-top:25px;
            border-radius:8px;
        }
    </style>
</head>

<body>

<div class="container">

<h1>Face Detector AI</h1>

<p>Upload an image to detect faces.</p>

<form action="/detect" method="POST" enctype="multipart/form-data">

    <input
        type="file"
        name="image"
        accept="image/*"
        required>

    <br>

    <button type="submit">
        Detect Face
    </button>

</form>

{% if image %}

<hr>

<h2>Detection Result</h2>

<img src="{{ image }}" alt="Detected Image">

{% endif %}

</div>

</body>
</html>
