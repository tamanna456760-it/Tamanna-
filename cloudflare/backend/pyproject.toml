[project]
name = "tamanna-ai-cloudflare-api"
version = "1.0.0"
description = "Tamanna AI FastAPI backend for Cloudflare Python Workers"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
]

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk",
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
