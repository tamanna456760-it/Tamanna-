<!DOCTYPE html>
<html>
<head>
  <title>Auto Save & Serial System</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    textarea { width: 100%; height: 150px; }
    ul { margin-top: 20px; }
  </style>
</head>
<body>

<h2>Auto Save File System</h2>

<textarea id="textInput" placeholder="Type something..."></textarea>

<h3>Saved Data</h3>
<ul id="dataList"></ul>

<script>
let data = JSON.parse(localStorage.getItem("autoData")) || [];

const input = document.getElementById("textInput");
const list = document.getElementById("dataList");

// Auto Save While Typing
input.addEventListener("input", () => {
  if(input.value.trim() !== ""){
    saveData(input.value.trim());
    input.value = "";
  }
});

// Save Data Function
function saveData(text){
  const serial = data.length + 1;

  const newItem = {
    id: serial,
    content: text
  };

  data.push(newItem);

  localStorage.setItem("autoData", JSON.stringify(data));

  renderList();
}

// Auto Position Fix & Render
function renderList(){
  list.innerHTML = "";

  data.forEach((item, index) => {
    item.id = index + 1; // Auto Fix Serial

    const li = document.createElement("li");
    li.textContent = item.id + ". " + item.content;

    list.appendChild(li);
  });

  localStorage.setItem("autoData", JSON.stringify(data));
}

// Load Saved Data On Refresh
renderList();
</script>

</body>
</html>
