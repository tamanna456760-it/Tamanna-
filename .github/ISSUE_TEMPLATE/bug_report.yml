name: Bug Report
description: Report a bug to help us improve
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "## 🐛 Bug Description\n\nDescribe the issue clearly and concisely."

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What went wrong?
      placeholder: "Example: When I click 'Save', the app crashes..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔄 Steps to Reproduce
      description: Provide a step-by-step guide.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Expected Behavior
      description: What did you expect to happen?
      placeholder: "The data should be saved and a success message shown."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ Actual Behavior
      description: What actually happened?
      placeholder: "The application freezes and shows a white screen."
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 💻 OS
      description: Which operating system?
      placeholder: "e.g., Windows 11, macOS Ventura, Ubuntu 22.04"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 📱 Device (if mobile)
      description: e.g., iPhone 14, Pixel 7, iPad Air
      placeholder: "Not applicable"

  - type: input
    id: version
    attributes:
      label: 🔢 App Version / Commit
      description: Version number or commit hash
      placeholder: "e.g., v2.1.0, 3f4a2d1"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 🚨 Severity
      description: How critical is this bug?
      options:
        - Critical (blocks core functionality)
        - Major (breaks major feature)
        - Minor (annoying but works)
        - Trivial (typo, layout glitch)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📄 Relevant Logs / Console Output
      description: Paste errors or console output (sensitive info redacted)
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: 📷 Screenshots / Recordings
      description: Drag & drop images or videos here (optional)
      placeholder: "Add screenshots to help explain your issue."

  - type: checkboxes
    id: checks
    attributes:
      label: ✅ Checklist
      description: Before submitting, please confirm
      options:
        - label: I have searched for existing issues (open/closed)
          required: true
        - label: I am running the latest version
          required: true