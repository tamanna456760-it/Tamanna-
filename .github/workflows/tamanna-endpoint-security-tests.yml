name: Tamanna Endpoint Security Tests
on:
  push:
    branches:
      - main
    paths:
      - "endpoint_security/**"
      - ".github/workflows/tamanna-endpoint-security-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "endpoint_security/**"
      - ".github/workflows/tamanna-endpoint-security-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tamanna-endpoint-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  endpoint-security-tests:
    name: Validate Endpoint Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Tamanna AI
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: endpoint_security/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r endpoint_security/requirements.txt
      - name: Validate configuration JSON
        run: |
          python -m json.tool endpoint_security/endpoint_config.json > /dev/null
          echo "Endpoint Security configuration JSON is valid."
      - name: Run Endpoint Security health check
        run: |
          python -m endpoint_security.health_check
      - name: Run unit tests
        run: |
          python -m unittest discover \
            -s endpoint_security/tests \
            -p "test_*.py" \
            -v