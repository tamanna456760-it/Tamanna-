name: Validate Tamanna Static Website (Cloudflare deploys production)

on:
  push:
    branches:
      - main
      - feature/github-browser-readonly
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-static-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate Cloudflare artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate server entry points
        run: npm run check

      - name: Run JavaScript tests (including GitHub browser integration)
        run: npm test

      - name: Build website
        run: npm run build

      - name: Validate Cloudflare static asset payload
        run: node scripts/verify-cloudflare-deploy.js

      - name: Verify canonical domain configuration
        run: |
          test "$(tr -d '\r\n' < CNAME)" = "www.bd-king-r7.com"
          grep -q '"directory": "./dist"' wrangler.jsonc
          echo "PASS: canonical hostname and Wrangler asset directory"

      - name: Upload website build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-website-dist-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
