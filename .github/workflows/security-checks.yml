
name: Tamanna Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-security-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    name: Python Syntax and Workflow Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        id: python-check
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p security-report
          export PYTHONPYCACHEPREFIX=/tmp/tamanna-pycache

          python - <<'PY'
          from pathlib import Path
          import py_compile
          import sys

          excluded = {
              ".git", ".venv", "venv", "node_modules",
              "__pycache__", ".tamanna-repair-backup"
          }
          failures = []
          checked = 0

          for path in sorted(Path(".").rglob("*.py")):
              if any(part in excluded for part in path.parts):
                  continue

              checked += 1
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append((str(path), str(exc)))

          report = Path("security-report/python-syntax.txt")
          with report.open("w", encoding="utf-8") as output:
              output.write(f"Python files checked: {checked}\n")
              output.write(f"Files with syntax errors: {len(failures)}\n\n")
              for name, error in failures:
                  output.write(f"FAIL: {name}\n{error}\n\n")

          print(f"Python files checked: {checked}")
          print(f"Syntax errors: {len(failures)}")

          for name, error in failures:
              print(f"\nFAIL: {name}\n{error}")

          if failures:
              sys.exit(1)
          PY

      - name: Audit workflow permissions and risky commands
        id: workflow-audit
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p security-report
          report="security-report/workflow-audit.txt"
          : > "$report"

          workflow_dir=".github/workflows"

          if [ ! -d "$workflow_dir" ]; then
            echo "No .github/workflows directory found." > "$report"
            exit 0
          fi

          echo "Read-only workflow review" >> "$report"
          echo "Findings require manual review; matches are not proof of a vulnerability." >> "$report"
          echo >> "$report"

          if grep -RInE \
            --include='*.yml' --include='*.yaml' \
            'contents:[[:space:]]*write|git[[:space:]]+push|git[[:space:]]+add[[:space:]]+\.' \
            "$workflow_dir" >> "$report"; then
            echo >> "$report"
            echo "Review the matches above for unnecessary write permissions or automatic pushes." >> "$report"
          else
            echo "No matching write-permission or push patterns found." >> "$report"
          fi

          cat "$report"

      - name: Check patch whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          echo "Whitespace check passed."

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-security-report-${{ github.run_id }}
          path: security-report/
          if-no-files-found: warn
          retention-days: 7
