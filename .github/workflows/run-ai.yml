name: Run Full AI System

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show Python Version
        run: |
          python --version
          python -m pip --version

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "requirements.txt not found - skipping dependency installation"
          fi

      - name: Install Basic Test Tools
        run: |
          python -m pip install pytest pytest-cov flake8

      - name: Python Syntax Check
        run: |
          mkdir -p reports

          find . \
            -type f \
            -name "*.py" \
            -not -path "./.git/*" \
            -not -path "./.venv/*" \
            -not -path "./venv/*" \
            -print0 |
          while IFS= read -r -d '' file; do
            echo "Checking: $file"

            if python -m py_compile "$file" 2>> reports/syntax_errors.log; then
              echo "OK: $file"
            else
              echo "FAILED: $file"
            fi
          done

      - name: Check Main Server
        run: |
          if [ -f main.py ]; then
            echo "main.py found"
            python -m py_compile main.py
          else
            echo "ERROR: main.py not found"
            exit 1
          fi

      - name: Run AI System Import Check
        run: |
          python - <<'PY'
          import main
          print("Tamanna AI main.py import: OK")
          PY

      - name: Run Tests
        run: |
          if find . -type f -name "test_*.py" -not -path "./.git/*" | grep -q .; then
            python -m pytest -q
          else
            echo "No pytest test files found - skipping"
          fi

      - name: Run Flake8 Basic Check
        continue-on-error: true
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=.git,.venv,venv,__pycache__

      - name: Generate Final Report
        if: always()
        run: |
          mkdir -p reports

          {
            echo "======================================"
            echo "Tamanna AI - Full System Report"
            echo "======================================"
            echo ""
            echo "Python:"
            python --version
            echo ""
            echo "Main Server:"
            if [ -f main.py ]; then
              echo "main.py FOUND"
            else
              echo "main.py NOT FOUND"
            fi
            echo ""
            echo "Project:"
            pwd
            echo ""
            echo "Python Files:"
            find . \
              -type f \
              -name "*.py" \
              -not -path "./.git/*" \
              | wc -l
            echo ""
            echo "Report generated successfully."
          } | tee reports/tamanna-ai-report.txt

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-ai-report
          path: reports/