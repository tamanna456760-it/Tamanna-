name: Tamanna AI Integration Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-ai-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-server.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server.txt
          python -m pip install pytest

      - name: Compile application and supporting modules
        run: |
          python -m compileall -q Main.py main.py tamanna_ai app_security data runner scripts tests

      - name: Import main application
        run: |
          python - <<'PY'
          from Main import app
          assert app.title == "Tamanna AI"
          print("PASS: Main FastAPI application imported.")
          PY

      - name: Run test suite
        run: python -m pytest -q
