
name: Tamanna AI - Safe Comment Audit

on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-comment-audit-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  audit-comment:
    name: Validate Comment Without Execution
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate requested command
        id: validate
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu

          mkdir -p audit-report

          command_status="manual_run"
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            case "$COMMENT_BODY" in
              "/deploy")
                command_status="recognized_deploy_request" ;;
              "/heal")
                command_status="recognized_heal_request" ;;
              "/chaos")
                command_status="recognized_chaos_request" ;;
              *)
                command_status="unrecognized_or_unsupported_comment" ;;
            esac
          fi

          {
            echo "command_status=$command_status"
          } >> "$GITHUB_OUTPUT"

          {
            echo "# Tamanna AI Comment Audit"
            echo
            echo "- Event: $EVENT_NAME"
            echo "- Result: $command_status"
            echo
            echo "This workflow only classifies comments."
            echo "No command was executed."
            echo "No deployment, healing, chaos test, commit, or push occurred."
          } > audit-report/comment-audit.md

          echo "Comment validation complete. No actions executed."

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-comment-audit-${{ github.run_id }}
          path: audit-report/
          if-no-files-found: warn
          retention-days: 7
