name: 🔱 Tamanna AI Pro – SHOKTISALI OMEGA

on:
  push:
    branches: ["main", "develop"]

  pull_request:
    types: [opened, synchronize, labeled]

  issue_comment:
    types: [created]

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: normal, full-refactor, chaos, heal-cluster"
        type: choice
        options:
          - normal
          - full-refactor
          - chaos
          - heal-cluster
        default: normal
        required: true

      skip_tests:
        description: "Skip tests"
        type: boolean
        default: false
        required: false

concurrency:
  group: tamanna-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_ENV: dev
  REGISTRY: ghcr.io
  ARTIFACT_RETENTION: 7


# ============================================================================
# 0. COMMANDER
# ============================================================================

jobs:

  commander:
    name: 🗣️ Natural Language Commander
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'issue_comment' &&
      startsWith(github.event.comment.body, '/')

    permissions:
      contents: read
      issues: write

    steps:

      - name: Parse command
        shell: bash
        run: |
          COMMENT='${{ github.event.comment.body }}'
          CMD=$(printf '%s\n' "$COMMENT" | awk '{print $1}')

          echo "Received command: $CMD"

          case "$CMD" in
            /deploy)
              echo "Deploy command detected."
              ;;
            /heal)
              echo "Heal command detected."
              ;;
            /chaos)
              echo "Chaos command detected."
              ;;
            *)
              echo "Unknown command: $CMD"
              ;;
          esac

      - name: Command summary
        run: |
          echo "## 🔱 Tamanna AI Commander" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Command received from issue/PR comment." >> "$GITHUB_STEP_SUMMARY"


# ============================================================================
# 1. FORECAST
# ============================================================================

  forecast:
    name: 🔮 Predictive Failure Forecast
    runs-on: ubuntu-latest

    outputs:
      likely_fail: ${{ steps.predict.outputs.likely_fail }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install forecast dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install pandas

      - name: Train/load prediction model
        run: |
          if [ -f scripts/predict_build.py ]; then
            python scripts/predict_build.py --train || true
          else
            echo "Prediction script not found."
          fi

      - name: Predict
        id: predict
        shell: bash
        run: |
          if [ -f scripts/predict_build.py ]; then

            set +e
            python scripts/predict_build.py --predict
            EXIT_CODE=$?
            set -e

            if [ "$EXIT_CODE" -eq 0 ]; then
              echo "likely_fail=false" >> "$GITHUB_OUTPUT"
            else
              echo "likely_fail=true" >> "$GITHUB_OUTPUT"
            fi

          else
            echo "likely_fail=false" >> "$GITHUB_OUTPUT"
            echo "No predictor found; continuing safely."
          fi


# ============================================================================
# 2. VALIDATION / SELF-HEAL PREPARATION
# ============================================================================

  validate:
    name: 🛡️ Core Validation
    runs-on: ubuntu-latest

    needs: forecast

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install pytest flake8

      - name: Python syntax scan
        run: |
          mkdir -p reports

          python -m compileall -q . \
            -x '(^|/)(\.git|\.venv|venv|__pycache__)(/|$)' \
            > reports/compile.log 2>&1 || true

          cat reports/compile.log

      - name: Main server validation
        run: |
          if [ -f main.py ]; then
            python -m py_compile main.py
            echo "✔ main.py syntax OK"
          else
            echo "⚠ main.py not found"
          fi

      - name: Flake8 critical scan
        continue-on-error: true
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=.git,.venv,venv,__pycache__

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-omega-validation
          path: reports/
          retention-days: ${{ env.ARTIFACT_RETENTION }}


# ============================================================================
# 3. TESTS
# ============================================================================

  hyper-tests:
    name: 🧪 Hyper Tests
    runs-on: ubuntu-latest

    needs:
      - forecast
      - validate

    if: |
      needs.forecast.outputs.likely_fail != 'true' &&
      github.event.inputs.skip_tests != 'true'

    strategy:
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4, 5]

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install pytest pytest-cov

      - name: Run test chunk
        shell: bash
        run: |
          if [ -d tests ]; then

            mapfile -t TEST_FILES < <(
              find tests \
                -type f \
                -name "test_*.py" \
                -o \
                -name "*_test.py" |
              sort
            )

            TOTAL=${#TEST_FILES[@]}

            if [ "$TOTAL" -eq 0 ]; then
              echo "No tests found."
              exit 0
            fi

            CHUNK=${{ matrix.chunk }}
            CHUNKS=5

            SELECTED=()

            for ((i=0; i<TOTAL; i++)); do
              if (( i % CHUNKS == CHUNK - 1 )); then
                SELECTED+=("${TEST_FILES[$i]}")
              fi
            done

            if [ "${#SELECTED[@]}" -eq 0 ]; then
              echo "No tests assigned to chunk $CHUNK."
              exit 0
            fi

            printf '%s\n' "${SELECTED[@]}"

            pytest -v "${SELECTED[@]}"

          else
            echo "tests/ directory not found."
          fi


# ============================================================================
# 4. SECURITY SCAN
# ============================================================================

  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      - name: Bandit scan
        continue-on-error: true
        run: |
          if find . \
            -type f \
            -name "*.py" \
            -not -path "./.git/*" \
            -print -quit | grep -q .; then

            bandit \
              -r . \
              -x ./.git,./.venv,./venv \
              -f txt \
              -o security-report.txt || true

          else
            echo "No Python files found." > security-report.txt
          fi

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-omega-security
          path: security-report.txt
          retention-days: ${{ env.ARTIFACT_RETENTION }}


# ============================================================================
# 5. ZERO-DAY / THREAT SCAN
# ============================================================================

  zero-day:
    name: 🚨 Threat Pattern Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check scanner
        run: |
          if [ -f scripts/zero_day_scan.py ]; then
            echo "✔ zero_day_scan.py found"
          else
            echo "⚠ zero_day_scan.py not found"
          fi

      - name: Run local threat scanner
        run: |
          if [ -f scripts/zero_day_scan.py ]; then
            python scripts/zero_day_scan.py --help || true
          else
            echo "Local threat scanner not configured."
          fi


# ============================================================================
# 6. BLOCKCHAIN MANIFEST
# ============================================================================

  blockchain:
    name: 🔗 Build Manifest
    runs-on: ubuntu-latest

    needs:
      - hyper-tests
      - security
      - zero-day

    if: always()

    steps:

      - name: Create manifest
        shell: bash
        run: |
          mkdir -p reports

          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          manifest = {
              "project": "Tamanna AI",
              "owner": "HM INSAN ALI",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "sha": os.environ.get("GITHUB_SHA"),
              "ref": os.environ.get("GITHUB_REF"),
              "timestamp": datetime.now(timezone.utc).isoformat(),
          }

          with open("reports/manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          PY

          cat reports/manifest.json

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-omega-manifest
          path: reports/manifest.json
          retention-days: ${{ env.ARTIFACT_RETENTION }}


# ============================================================================
# 7. MULTI-CLOUD — CONTROLLED
# ============================================================================

  multi-cloud:
    name: ☁️ Multi-Cloud Deployment Gate
    runs-on: ubuntu-latest

    needs:
      - hyper-tests
      - security
      - blockchain

    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.mode == 'normal'

    strategy:
      matrix:
        cloud:
          - aws
          - gcp
          - azure

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Deployment gate
        run: |
          echo "Cloud target: ${{ matrix.cloud }}"
          echo ""
          echo "Deployment is gated."
          echo "Configure authenticated cloud credentials before enabling"
          echo "real deployment commands."


# ============================================================================
# 8. CANARY GATE
# ============================================================================

  canary-ai:
    name: 🐤 Canary Deployment Gate
    runs-on: ubuntu-latest

    needs:
      - hyper-tests
      - security

    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    steps:

      - name: Canary preparation
        run: |
          echo "Canary deployment requested."
          echo "Kubernetes credentials and cluster configuration required."

      - name: Canary status
        run: |
          echo "✔ Canary gate passed."
          echo "No production traffic changes were performed."


# ============================================================================
# 9. CHAOS MODE — MANUAL ONLY
# ============================================================================

  chaos:
    name: 💥 Chaos Engineering Gate
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.mode == 'chaos'

    steps:

      - name: Safety gate
        run: |
          echo "CHAOS MODE requested."
          echo ""
          echo "No infrastructure mutation is performed by default."
          echo "Configure an isolated test cluster before enabling chaos actions."

      - name: Chaos configuration check
        run: |
          if [ -f chaos/pod-kill.yaml ]; then
            echo "✔ chaos/pod-kill.yaml found"
          else
            echo "⚠ chaos/pod-kill.yaml not found"
          fi


# ============================================================================
# 10. FULL REFACTOR — MANUAL
# ============================================================================

  full-refactor:
    name: 🧠 Full Refactor Gate
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.mode == 'full-refactor'

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor script check
        run: |
          if [ -f scripts/refactor_all.py ]; then
            echo "✔ Refactor engine found."
          else
            echo "⚠ Refactor engine not found."
          fi

      - name: Create refactor report
        run: |
          mkdir -p reports

          echo "# Tamanna AI Refactor Report" > reports/refactor.md
          echo "" >> reports/refactor.md
          echo "Mode: full-refactor" >> reports/refactor.md
          echo "Commit: $GITHUB_SHA" >> reports/refactor.md
          echo "" >> reports/refactor.md
          echo "No automatic source mutation was performed." >> reports/refactor.md

      - name: Upload refactor report
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-omega-refactor
          path: reports/refactor.md
          retention-days: ${{ env.ARTIFACT_RETENTION }}


# ============================================================================
# 11. WORKFLOW EVOLUTION — REVIEW ONLY
# ============================================================================

  evolve-workflow:
    name: 🧬 Workflow Evolution Review
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'schedule' &&
      github.run_number % 12 == 0

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect workflow
        run: |
          FILE=".github/workflows/tamanna-ai-ultimate.yml"

          if [ -f "$FILE" ]; then
            echo "✔ Workflow found: $FILE"
            wc -l "$FILE"
          else
            echo "⚠ Workflow file not found."
          fi

      - name: Evolution safety policy
        run: |
          echo "Workflow self-modification is disabled."
          echo "Review changes manually before committing workflow changes."


# ============================================================================
# 12. COST ANALYSIS
# ============================================================================

  cost-opt:
    name: 💰 Cost Analysis
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:

      - name: Setup GitHub CLI
        run: |
          gh --version

      - name: Collect workflow data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            "/repos/${{ github.repository }}/actions/runs?per_page=50" \
            --jq '.workflow_runs[] |
              {
                id: .id,
                name: .name,
                status: .status,
                conclusion: .conclusion,
                created_at: .created_at,
                updated_at: .updated_at
              }' \
            > cost.json

          cat cost.json

      - name: Generate cost report
        run: |
          {
            echo "# Tamanna AI Cost Analysis"
            echo ""
            echo "Repository: $GITHUB_REPOSITORY"
            echo ""
            echo "Recent workflow runs:"
            echo ""
            echo '```json'
            cat cost.json
            echo '```'
          } > cost-report.md

      - name: Upload cost report
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-omega-cost-report
          path: cost-report.md
          retention-days: ${{ env.ARTIFACT_RETENTION }}


# ============================================================================
# 13. FINAL SUMMARY
# ============================================================================

  summary:
    name: 📊 OMEGA Summary
    runs-on: ubuntu-latest

    needs:
      - forecast
      - validate
      - hyper-tests
      - security
      - zero-day
      - blockchain
      - multi-cloud
      - canary-ai
      - chaos
      - full-refactor
      - evolve-workflow
      - cost-opt

    if: always()

    steps:

      - name: Generate summary
        shell: bash
        run: |
          echo "## 🔱 Tamanna AI Pro – SHOKTISALI OMEGA" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Owner:** HM INSAN ALI" >> "$GITHUB_STEP_SUMMARY"
          echo "**Environment:** $DEPLOY_ENV" >> "$GITHUB_STEP_SUMMARY"
          echo "**Workflow:** $GITHUB_WORKFLOW" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run:** $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Job Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Component | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Forecast | ${{ needs.forecast.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validation | ${{ needs.validate.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tests | ${{ needs.hyper-tests.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security | ${{ needs.security.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Threat Scan | ${{ needs.zero-day.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Manifest | ${{ needs.blockchain.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Multi-Cloud | ${{ needs.multi-cloud.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Canary | ${{ needs.canary-ai.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Chaos | ${{ needs.chaos.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Refactor | ${{ needs.full-refactor.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Evolution | ${{ needs.evolve-workflow.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cost | ${{ needs.cost-opt.result }} |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tamanna AI OMEGA workflow completed." >> "$GITHUB_STEP_SUMMARY"