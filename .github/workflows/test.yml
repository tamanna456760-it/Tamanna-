name: Tamanna Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python syntax, tests and retrieval benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-server.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-server.txt -r requirements-test.txt

      - name: Compile project modules
        run: |
          set -euo pipefail
          python -m compileall -q Main.py run_server.py data modules tests scripts Tamanna-.sln 2>/dev/null || true

      - name: Run test suite
        run: |
          set -euo pipefail
          pytest -q

      - name: Run API-free retrieval benchmark
        run: |
          set -euo pipefail
          python scripts/benchmark_vector_retrieval.py --top-k 3 > benchmark-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("benchmark-report.json").read_text(encoding="utf-8"))
          lines = [
              "## Tamanna local retrieval benchmark",
              "",
              f"- Cases: {report['cases']}",
              f"- Top K: {report['top_k']}",
              f"- Hit rate: {report['hit_rate']:.2%}",
              f"- Mean reciprocal rank: {report['mean_reciprocal_rank']:.4f}",
              f"- Embedder: {report['embedding_provider']}",
              "",
              "| Language | Cases | Hit rate | MRR |",
              "|---|---:|---:|---:|",
          ]
          for language, stats in report["by_language"].items():
              lines.append(
                  f"| {language} | {stats['cases']} | {stats['hit_rate']:.2%} | "
                  f"{stats['mean_reciprocal_rank']:.4f} |"
              )
          Path("benchmark-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Upload retrieval benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-retrieval-benchmark
          path: |
            benchmark-report.json
            benchmark-summary.md
          if-no-files-found: error
          retention-days: 14
