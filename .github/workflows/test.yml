name: Tamanna Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-server.txt

      - name: Install server and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server.txt pytest

      - name: Compile application and test modules
        run: |
          python -m compileall -q Main.py main.py tamanna_ai tests

      - name: Run focused test suite
        run: python -m pytest -q
