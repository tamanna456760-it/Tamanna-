name: Full Code Test System

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-full-code-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-all-files:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-server.txt
            runner/python/requirements.txt

      - name: Install application and runner dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server.txt
          python -m pip install -r runner/python/requirements.txt
          python -m pip install pytest

      - name: Compile project Python files
        run: |
          python -m compileall -q tamanna_ai app_security api core data runner scripts tests

      - name: Validate workflow inventory
        run: python scripts/audit_workflows.py

      - name: Run automated tests
        run: python -m pytest -q
