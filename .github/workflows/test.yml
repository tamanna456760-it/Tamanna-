name: Tamanna Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-server.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-server.txt -r requirements-test.txt

      - name: Compile project modules
        run: |
          set -euo pipefail
          python -m compileall -q Main.py run_server.py data modules tests scripts Tamanna-.sln 2>/dev/null || true

      - name: Run test suite
        run: |
          set -euo pipefail
          pytest -q
