name: Full Code Test System

on:
  push:
    branches:
      - main
      - security/full-system-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tamanna-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    name: Compile and Run Access-Control Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-server.txt

      - name: Install Runtime and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server.txt pytest

      - name: Compile Application Modules
        run: |
          python -m compileall -q Main.py main.py api app_security core runner tamanna_ai modules

      - name: Run Access-Control Regression Tests
        run: python -m pytest -q tests/test_access_control.py

      - name: Check Patch Whitespace
        run: git diff --check
