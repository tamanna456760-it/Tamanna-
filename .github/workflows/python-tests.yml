name: Python Tests

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-python-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pytest:
    name: Install server dependencies and run pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-server.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server.txt
          python -m pip install -r runner/python/requirements.txt
          python -m pip install pytest

      - name: Check Python syntax
        run: python -m compileall -q tamanna_ai tests scripts runner/python

      - name: Validate memory JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('tamanna_ai/memory').glob('*.json')):
              with path.open(encoding='utf-8') as stream:
                  value = json.load(stream)
              if not isinstance(value, dict):
                  raise SystemExit(f'{path}: expected a JSON object')
          print('Memory JSON validation passed.')
          PY

      - name: Inventory workflow directory
        run: python scripts/audit_workflows.py

      - name: Run test suite
        run: python -m pytest -q
