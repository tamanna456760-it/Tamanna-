name: Sync GitHub repositories into Tamanna memory

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  repository_dispatch:
    types: [tamanna-repository-added]

permissions:
  contents: write

concurrency:
  group: github-repository-memory
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync accessible repositories
        env:
          TAMANNA_GITHUB_TOKEN: ${{ secrets.TAMANNA_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_github_repositories.py

      - name: Commit updated repository memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory/github_repositories.json
          if git diff --cached --quiet; then
            echo "Repository memory is already current."
            exit 0
          fi
          git commit -m "chore(memory): sync GitHub repository index"
          git push origin HEAD:main
