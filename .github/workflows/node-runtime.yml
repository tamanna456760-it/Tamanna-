name: Tamanna Node Runtime Validation

on:
  push:
    branches: [main]
    paths:
      - "runner/node/**"
      - ".github/workflows/node-runtime.yml"
  pull_request:
    branches: [main]
    paths:
      - "runner/node/**"
      - ".github/workflows/node-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-node-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve isolated Node runtime dependencies
        run: npm install --prefix runner/node --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact resolved dependency tree
        run: npm ci --prefix runner/node --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --prefix runner/node --omit=dev

      - name: Check active CommonJS entrypoints
        run: |
          node --check runner/node/run.js
          node --check runner/node/run..js
          node --check runner/node/server.js
          node --check runner/node/ai_server.js
          node --check runner/node/node_server.js
          node --check runner/node/bot.js
          node --check runner/node/git.js
          node --check runner/node/github.js
          node --check runner/node/github-sync.js
          node --check runner/node/monitor.js
          node --check runner/node/security.js
          node --check runner/node/generator.js
          node --check runner/node/agent.js
          node --check runner/node/ai-github-bot.js

      - name: Run Node runtime safety tests
        run: npm test --prefix runner/node
