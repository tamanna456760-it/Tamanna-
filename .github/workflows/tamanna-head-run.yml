name: Tamanna AI Manual Read-Only Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-manual-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python and Deployment Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python Syntax
        run: |
          python -m compileall -q Main.py main.py scripts tamanna_ai

      - name: Validate Deployment Configuration
        run: |
          python deploy/validate_deployment.py

      - name: Validate Release Files
        run: |
          python deploy/validate_release.py
