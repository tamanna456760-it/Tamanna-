name: Tamanna HEAD Safety Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm safe mode
        run: |
          echo "Legacy tamanna_head.py execution and manifest auto-push are disabled."
          echo "No project script is executed and no repository file is modified."
