
name: Tamanna Full System Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/tamanna_full_audit.py"
      - ".github/workflows/tamanna-full-audit.yml"
      - "main.py"
      - "Main.py"
      - "requirements.txt"
      - "tamanna_ai/**"
      - "modules/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: tamanna-full-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Read-only system audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML parser
        run: python -m pip install PyYAML

      - name: Run audit
        id: audit
        continue-on-error: true
        run: python scripts/tamanna_full_audit.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-full-system-audit
          path: reports/tamanna_full_audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if high-severity findings exist
        if: steps.audit.outcome == 'failure'
        run: |
          echo "Audit found high-severity issues or could not complete."
          exit 1
