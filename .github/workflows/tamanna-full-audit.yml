
name: Tamanna Full System Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML parser
        run: python -m pip install PyYAML

      - name: Run Tamanna audit
        run: python scripts/tamanna_full_audit.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-full-system-audit
          path: reports/tamanna_full_audit.json
          if-no-files-found: warn
          retention-days: 14
