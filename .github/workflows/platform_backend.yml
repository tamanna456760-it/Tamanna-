name: Platform Backend - Read Only Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-backend-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          excluded = {".git", ".venv", "venv", "node_modules", "__pycache__"}
          errors = []
          count = 0
          for path in Path(".").rglob("*.py"):
              if any(part in excluded for part in path.parts):
                  continue
              count += 1
              try:
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except (SyntaxError, UnicodeDecodeError, OSError) as exc:
                  errors.append(f"{path}: {exc}")
          print(f"Scanned {count} Python files.")
          if errors:
              print("\\n".join(errors))
              raise SystemExit(1)
          print("PASS: syntax validation")
          PY

      - name: Run tests when available
        run: |
          if [ -d tests ]; then
            python -m pip install pytest
            python -m pytest -q tests
          else
            echo "No tests directory; skipped."
          fi

      - name: Report read-only mode
        if: always()
        run: |
          echo "No project auto-fixer or main application was executed."
          echo "No files were committed, pushed, or deployed."
