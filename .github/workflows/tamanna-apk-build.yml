name: "Build Tamanna APK"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug and Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Android project
        run: |
          set -euo pipefail
          test -f tamanna-ai-app/settings.gradle
          test -f tamanna-ai-app/build.gradle
          test -f tamanna-ai-app/app/build.gradle
          test -f tamanna-ai-app/app/src/main/AndroidManifest.xml
          test -f tamanna-ai-app/app/src/build/java/com/tamanna/ai/TamannaWebActivity.kt
          echo "Android project: tamanna-ai-app"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android compile SDK
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list_installed | grep -E 'platforms;android-34|build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"
          validate-wrappers: false

      - name: Build debug APK
        working-directory: tamanna-ai-app
        run: gradle --no-daemon assembleDebug

      - name: Build release APK
        if: always()
        working-directory: tamanna-ai-app
        run: gradle --no-daemon assembleRelease

      - name: Locate and package APK files
        run: |
          set -euo pipefail
          mkdir -p packaged-apk/debug packaged-apk/release
          find tamanna-ai-app/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -exec cp {} packaged-apk/debug/ \;
          find tamanna-ai-app/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -exec cp {} packaged-apk/release/ \;
          test "$(find packaged-apk/debug -type f -name '*.apk' | wc -l)" -gt 0
          test "$(find packaged-apk/release -type f -name '*.apk' | wc -l)" -gt 0
          echo "DEBUG APK:"
          find packaged-apk/debug -type f -name '*.apk' -print
          echo "RELEASE APK:"
          find packaged-apk/release -type f -name '*.apk' -print

      - name: Upload debug APK artifact
        if: always() && hashFiles('packaged-apk/debug/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-apk-debug-${{ github.run_id }}
          path: packaged-apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK artifact
        if: always() && hashFiles('packaged-apk/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-apk-release-${{ github.run_id }}
          path: packaged-apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Tamanna APK Build"
            echo "- Debug APK: requested"
            echo "- Release APK: requested (unsigned unless signing is configured)"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Status: $JOB_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
