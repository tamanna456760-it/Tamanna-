
name: "Build Tamanna APK"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: tamanna-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android project
        run: |
          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew not found at repository root."
            exit 1
          fi

          if [ ! -d app ]; then
            echo "ERROR: app/ directory not found at repository root."
            exit 1
          fi

          chmod +x gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Determine build type
        id: build_type
        env:
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          BUILD_TYPE="${INPUT_BUILD_TYPE:-debug}"

          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            BUILD_TYPE="debug"
          fi

          if [ "$BUILD_TYPE" != "debug" ] && [ "$BUILD_TYPE" != "release" ]; then
            echo "ERROR: Unsupported build type."
            exit 1
          fi

          echo "value=$BUILD_TYPE" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        if: steps.build_type.outputs.value == 'debug'
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK
        if: steps.build_type.outputs.value == 'release'
        run: ./gradlew --no-daemon assembleRelease

      - name: Locate APK files
        id: apk
        env:
          BUILD_TYPE: ${{ steps.build_type.outputs.value }}
        run: |
          APK_DIR="app/build/outputs/apk/$BUILD_TYPE"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: Expected APK directory not found: $APK_DIR"
            exit 1
          fi

          mkdir -p packaged-apk
          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -exec cp {} packaged-apk/ \;

          if [ -z "$(find packaged-apk -type f -name '*.apk' -print -quit)" ]; then
            echo "ERROR: Gradle did not produce an APK."
            exit 1
          fi

          echo "APK files produced:"
          find packaged-apk -type f -name '*.apk' -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-apk-${{ steps.build_type.outputs.value }}-${{ github.run_id }}
          path: packaged-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        env:
          BUILD_TYPE: ${{ steps.build_type.outputs.value }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Tamanna APK Build"
            echo "- Build type: ${BUILD_TYPE:-unknown}"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Status: $JOB_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
