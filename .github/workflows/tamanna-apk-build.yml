name: "Build Tamanna APK"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: tamanna-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Android project
        run: |
          set -euo pipefail
          test -f tamanna-ai-app/settings.gradle
          test -f tamanna-ai-app/build.gradle
          test -f tamanna-ai-app/app/build.gradle
          test -f tamanna-ai-app/app/src/main/AndroidManifest.xml
          test -f tamanna-ai-app/app/src/build/java/com/tamanna/ai/TamannaWebActivity.kt
          echo "Android project: tamanna-ai-app"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package was removed from Google's SDK repository.
          # Install only supported SDK packages required by compileSdk 34.
          packages: 'platform-tools, platforms;android-34, build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Determine build type
        id: build_type
        env:
          INPUT_BUILD_TYPE: ${{ inputs.build_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          BUILD_TYPE="${INPUT_BUILD_TYPE:-debug}"
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            BUILD_TYPE="debug"
          fi
          if [ "$BUILD_TYPE" != "debug" ] && [ "$BUILD_TYPE" != "release" ]; then
            echo "ERROR: Unsupported build type."
            exit 1
          fi
          echo "value=$BUILD_TYPE" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        if: steps.build_type.outputs.value == 'debug'
        working-directory: tamanna-ai-app
        run: gradle --no-daemon assembleDebug

      - name: Build release APK
        if: steps.build_type.outputs.value == 'release'
        working-directory: tamanna-ai-app
        run: gradle --no-daemon assembleRelease

      - name: Locate APK files
        id: apk
        env:
          BUILD_TYPE: ${{ steps.build_type.outputs.value }}
        run: |
          set -euo pipefail
          APK_DIR="tamanna-ai-app/app/build/outputs/apk/$BUILD_TYPE"
          test -d "$APK_DIR"
          mkdir -p packaged-apk
          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -exec cp {} packaged-apk/ \;
          APK_COUNT="$(find packaged-apk -type f -name '*.apk' | wc -l)"
          test "$APK_COUNT" -gt 0
          echo "APK_COUNT=$APK_COUNT" >> "$GITHUB_OUTPUT"
          find packaged-apk -type f -name '*.apk' -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-apk-${{ steps.build_type.outputs.value }}-${{ github.run_id }}
          path: packaged-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        env:
          BUILD_TYPE: ${{ steps.build_type.outputs.value }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Tamanna APK Build"
            echo "- Project: tamanna-ai-app"
            echo "- Build type: ${BUILD_TYPE:-unknown}"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- Status: $JOB_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
