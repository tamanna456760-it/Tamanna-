
name: Tamanna Auto Heal - Safe Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate without modifying files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Validate JSON files safely
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          excluded = {'.git', 'node_modules', '.venv', 'venv'}
          failures = []
          checked = 0

          for path in Path('.').rglob('*.json'):
              if any(part in excluded for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8-sig')
                  json.loads(text)
                  checked += 1
                  print(f'PASS: {path}')
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  failures.append((path, exc))
                  if isinstance(exc, json.JSONDecodeError):
                      print(f'ERROR: {path}:{exc.lineno}:{exc.colno}: {exc.msg}')
                  else:
                      print(f'ERROR: {path}: {exc}')

          print(f'JSON files checked: {checked}')
          if failures:
              raise SystemExit(f'{len(failures)} invalid or unreadable JSON file(s).')
          print('PASS: all discovered JSON files are valid.')
          PY


      - name: Validate YAML files
        run: |
          python -m pip install PyYAML

          python - <<'PY'
          from pathlib import Path
          import yaml

          skip = {".git", ".venv", "venv", "node_modules"}
          errors = []

          for path in list(Path(".").rglob("*.yml")) + list(Path(".").rglob("*.yaml")):
              if any(part in skip for part in path.parts):
                  continue
              try:
                  with path.open(encoding="utf-8") as stream:
                      list(yaml.safe_load_all(stream))
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)

          print("PASS: YAML syntax validation completed.")
          PY

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          skip = {".git", ".venv", "venv", "node_modules", "__pycache__"}
          errors = []

          for path in Path(".").rglob("*.py"):
              if any(part in skip for part in path.parts):
                  continue
              try:
                  ast.parse(path.read_text(encoding="utf-8"))
              except (SyntaxError, UnicodeDecodeError) as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)

          print("PASS: Python syntax validation completed.")
          PY

      - name: Finish
        run: echo "Tamanna safe validation completed. No project files were changed."
