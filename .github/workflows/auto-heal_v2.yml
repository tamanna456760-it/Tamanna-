
name: Tamanna Auto Heal - Safe Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate without modifying files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate JSON files safely
        shell: bash
        run: |
          set -uo pipefail
          errors=0

          while IFS= read -r -d '' file; do
            if jq empty "$file" >/dev/null 2>&1; then
              echo "PASS: $file"
            else
              echo "ERROR: Invalid JSON: $file"
              errors=1
            fi
          done < <(
            find . \
              -type d \( \
                -name .git -o \
                -name node_modules -o \
                -name .venv -o \
                -name venv \
              \) -prune \
              -o -type f -name '*.json' -print0
          )

          if [ "$errors" -ne 0 ]; then
            echo "Invalid JSON detected. No files were modified."
            exit 1
          fi

      - name: Validate YAML files
        run: |
          python -m pip install PyYAML

          python - <<'PY'
          from pathlib import Path
          import yaml

          skip = {".git", ".venv", "venv", "node_modules"}
          errors = []

          for path in list(Path(".").rglob("*.yml")) + list(Path(".").rglob("*.yaml")):
              if any(part in skip for part in path.parts):
                  continue
              try:
                  with path.open(encoding="utf-8") as stream:
                      list(yaml.safe_load_all(stream))
              except Exception as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)

          print("PASS: YAML syntax validation completed.")
          PY

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          skip = {".git", ".venv", "venv", "node_modules", "__pycache__"}
          errors = []

          for path in Path(".").rglob("*.py"):
              if any(part in skip for part in path.parts):
                  continue
              try:
                  ast.parse(path.read_text(encoding="utf-8"))
              except (SyntaxError, UnicodeDecodeError) as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)

          print("PASS: Python syntax validation completed.")
          PY

      - name: Finish
        run: echo "Tamanna safe validation completed. No project files were changed."
