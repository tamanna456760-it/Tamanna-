name: Tamanna Auto Heal Engine v2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Install tools (jq, yq)
      run: |
        sudo apt-get update
        sudo apt-get install -y jq
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

    - name: Ensure base folders exist
      run: |
        echo "🗂 Ensuring base folders..."
        mkdir -p src
        mkdir -p config
        mkdir -p scripts
        mkdir -p logs
        mkdir -p bd-king-r7

    - name: Scan for empty files
      run: |
        echo "🔍 Scanning for empty files..."
        find . -type f -empty > empty_files.txt
        cat empty_files.txt || true

    - name: Auto-fill empty files
      run: |
        while read file; do
          if [ -n "$file" ]; then
            echo "🛠 Filling: $file"
            echo "# Auto-generated by Tamanna Auto-Heal Engine v2" > "$file"
          fi
        done < empty_files.txt || true

    - name: Fix corrupted JSON
      run: |
        echo "🔍 Checking JSON files..."
        for f in $(find . -name "*.json"); do
          if ! jq empty "$f" 2>/dev/null; then
            echo "⚠️ Corrupted JSON: $f → resetting to {}"
            echo "{}" > "$f"
          fi
        done

    - name: Fix corrupted YAML
      run: |
        echo "🔍 Checking YAML files..."
        for f in $(find . -name "*.yml" -o -name "*.yaml"); do
          if ! yq e '.' "$f" >/dev/null 2>&1; then
            echo "⚠️ Corrupted YAML: $f → resetting to empty doc"
            echo "# Auto-fixed by Tamanna Auto-Heal v2" > "$f"
          fi
        done

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: "18"

    - name: Node dependencies & basic check
      run: |
        if [ -f "package.json" ]; then
          echo "📦 Node project detected"
          npm install --silent || true
        fi

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Python dependencies & basic check
      run: |
        if [ -f "requirements.txt" ]; then
          echo "🐍 Python project detected"
          pip install -r requirements.txt || true
        fi

    - name: Auto-commit healed changes
      run: |
        git config --global user.name "Tamanna Auto Heal v2"
        git config --global user.email "auto@tamanna.ai"
        git add .
        git commit -m "Auto-Heal v2: fixed empty/corrupted files & structure" || true
        git push || true

    - name: Done
      run: echo "✨ Tamanna Auto-Heal v2 completed."
