name: Frontend Import Path Validation

on:
  push:
    branches: [main]
    paths:
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "scripts/check-import-case.js"
      - ".github/workflows/frontend-import-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "scripts/check-import-case.js"
      - ".github/workflows/frontend-import-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check relative imports in maintained website runtime
        run: node scripts/check-import-case.js
