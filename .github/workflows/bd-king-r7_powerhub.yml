name: BD-KING-R7 Android APK Build - Manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - name: Build APK if Android project exists
        shell: bash
        run: |
          if [ ! -x android/gradlew ]; then
            echo "Android Gradle wrapper not found or not executable; no APK was built."
            exit 1
          fi
          cd android
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
