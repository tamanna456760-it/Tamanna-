name: Tamanna Self-Heal Review - Manual Read-Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax and empty-file audit
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          excluded = {".git", ".venv", "venv", "node_modules", "__pycache__"}
          errors = []
          empty = []
          for p in Path(".").rglob("*"):
              if any(part in excluded for part in p.parts):
                  continue
              if p.is_file() and p.stat().st_size == 0:
                  empty.append(str(p))
              if p.is_file() and p.suffix == ".py":
                  try:
                      ast.parse(p.read_text(encoding="utf-8"), filename=str(p))
                  except (OSError, UnicodeError, SyntaxError) as e:
                      errors.append(f"{p}: {e}")
          print(f"Empty files: {len(empty)}")
          print("\n".join(empty))
          print(f"Python syntax errors: {len(errors)}")
          print("\n".join(errors))
          raise SystemExit(bool(errors))
          PY
      - run: echo "Automatic repair and repository writes are disabled."
