name: Tamanna Auto Heal

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  auto-heal:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Scan for Missing or Empty Files
      run: |
        echo "🔍 Scanning repository..."
        find . -type f -empty > empty_files.txt
        echo "Empty or missing files detected:"
        cat empty_files.txt || true

    - name: Auto‑Fix Empty Files
      run: |
        while read file; do
          if [ -n "$file" ]; then
            echo "⚠️ Auto‑fixing: $file"
            echo "# Auto‑generated by Tamanna Auto‑Heal Engine" > "$file"
          fi
        done < empty_files.txt

    - name: Syntax Check (Node + Python)
      run: |
        echo "🔍 Checking syntax..."
        if [ -f "package.json" ]; then
          echo "➡️ Node project detected"
          npm install --silent || true
        fi

        if [ -f "requirements.txt" ]; then
          echo "➡️ Python project detected"
          pip install -r requirements.txt || true
        fi

    - name: Auto Commit Fixes
      run: |
        git config --global user.name "tamanna456760-it"
        git config --global user.email "tamanna456760@gmail.com"
        git add .
        git commit -m "Auto‑Heal: Fixed missing/empty files" || true
        git push || true

    - name: Done
      run: echo "✨ Tamanna Auto‑Heal Completed!"
