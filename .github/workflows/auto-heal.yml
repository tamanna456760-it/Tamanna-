name: Tamanna Auto Heal (Advanced)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force_heal:
        description: 'Force heal even if no issues found'
        required: false
        type: boolean
        default: false

# Prevent concurrent runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # Required to push fixes

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # Full history for better commit detection

    - name: 🐍 Setup Python (for advanced checks)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Install optional tools
      run: |
        pip install --upgrade pip
        pip install pyyaml requests  # for future extensibility
        sudo apt-get update && sudo apt-get install -y jq shellcheck

    # 1️⃣ Detect both empty AND missing essential files (like README, configs)
    - name: 🔍 Scan for Missing & Empty Files
      id: scan
      run: |
        echo "🔍 Scanning repository for issues..."
        > empty_files.txt
        > missing_files.txt

        # Find empty files (size 0)
        find . -type f -size 0 -not -path "./.git/*" >> empty_files.txt

        # Define critical files that MUST exist (customize as needed)
        CRITICAL_FILES=("README.md" "LICENSE" ".gitignore")
        for file in "${CRITICAL_FILES[@]}"; do
          if [ ! -f "$file" ]; then
            echo "$file" >> missing_files.txt
          fi
        done

        # Also detect missing main script files (if any are expected)
        if [ -f "package.json" ]; then
          if [ ! -f "index.js" ] && [ ! -f "main.js" ] && [ ! -f "app.js" ]; then
            echo "index.js (missing entry point for Node project)" >> missing_files.txt
          fi
        fi

        if [ -f "requirements.txt" ] || [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then
          if [ ! -f "main.py" ] && [ ! -f "app.py" ]; then
            echo "main.py (missing main module for Python project)" >> missing_files.txt
          fi
        fi

        echo "EMPTY_COUNT=$(wc -l < empty_files.txt)" >> $GITHUB_OUTPUT
        echo "MISSING_COUNT=$(wc -l < missing_files.txt)" >> $GITHUB_OUTPUT

        if [ "${{ github.event.inputs.force_heal }}" == "true" ] || [ "$EMPTY_COUNT" -gt 0 ] || [ "$MISSING_COUNT" -gt 0 ]; then
          echo "HEAL_NEEDED=true" >> $GITHUB_OUTPUT
        else
          echo "HEAL_NEEDED=false" >> $GITHUB_OUTPUT
        fi

        echo "Empty files:" && cat empty_files.txt || true
        echo "Missing files:" && cat missing_files.txt || true

    - name: 🛠 Auto‑Fix Empty & Missing Files
      if: steps.scan.outputs.HEAL_NEEDED == 'true'
      run: |
        # Fix empty files
        while IFS= read -r file; do
          if [ -n "$file" ]; then
            echo "⚠️ Auto‑fixing empty file: $file"
            # Add sensible default content based on extension
            case "$file" in
              *.md)    echo "# Auto‑generated by Tamanna Auto‑Heal" > "$file" ;;
              *.json)  echo "{}" > "$file" ;;
              *.yaml|*.yml) echo "# placeholder" > "$file" ;;
              *.sh)    echo "#!/bin/bash\necho 'Healed by Tamanna'" > "$file"; chmod +x "$file" ;;
              *.py)    echo "# Auto‑generated stub\ndef main():\n    pass\n\nif __name__ == '__main__':\n    main()" > "$file" ;;
              *.js)    echo "// Auto‑generated stub\nconsole.log('Healed by Tamanna');" > "$file" ;;
              *)       echo "# Auto‑generated by Tamanna Auto‑Heal Engine" > "$file" ;;
            esac
          fi
        done < empty_files.txt

        # Create missing critical files
        while IFS= read -r file; do
          if [ -n "$file" ]; then
            echo "📄 Creating missing file: $file"
            case "$file" in
              README.md)  echo "# Project Title\n\nAuto‑maintained by Tamanna Auto‑Heal" > "$file" ;;
              LICENSE)    echo "MIT License\n\nCopyright (c) $(date +%Y) Tamanna" > "$file" ;;
              .gitignore) echo "# Python\n__pycache__/\n*.pyc\n# Node\nnode_modules/\n.env" > "$file" ;;
              index.js|main.js|app.js) echo "// Entry point\nconsole.log('Application started');" > "$file" ;;
              main.py|app.py) echo "# Entry point\nprint('Application started')" > "$file" ;;
              *)          echo "# Auto‑created by Tamanna Auto‑Heal" > "$file" ;;
            esac
          fi
        done < missing_files.txt

    - name: 🔧 Syntax & Dependency Validation (Node + Python)
      if: steps.scan.outputs.HEAL_NEEDED == 'true'
      run: |
        echo "🔍 Running syntax and dependency checks..."
        NODE_ERROR=0
        PYTHON_ERROR=0

        if [ -f "package.json" ]; then
          echo "➡️ Node.js project detected"
          npm install --silent || NODE_ERROR=$?
          if [ -f "node_modules/.bin/eslint" ]; then
            npx eslint . --fix || true
          fi
          # Try to parse all .js files for syntax
          find . -name "*.js" -not -path "./node_modules/*" -exec node --check {} \; 2>> node_errors.log || NODE_ERROR=$?
        fi

        if [ -f "requirements.txt" ] || [ -f "setup.py" ]; then
          echo "➡️ Python project detected"
          pip install -r requirements.txt --quiet || PYTHON_ERROR=$?
          # Syntax check all .py files
          find . -name "*.py" -not -path "./__pycache__/*" -exec python -m py_compile {} \; 2>> python_errors.log || PYTHON_ERROR=$?
        fi

        # Save error counts for later summary
        echo "NODE_ERROR=$NODE_ERROR" >> $GITHUB_ENV
        echo "PYTHON_ERROR=$PYTHON_ERROR" >> $GITHUB_ENV

    - name: 📝 Commit & Push Fixes (only if changes exist)
      if: steps.scan.outputs.HEAL_NEEDED == 'true'
      run: |
        git config --global user.name "tamanna456760-it"
        git config --global user.email "tamanna456760@gmail.com"
        git add .
        # Check if there are any changes to commit
        if git diff --staged --quiet; then
          echo "✅ No changes to commit – repository already healthy."
        else
          git commit -m "🤖 Auto‑Heal: Fixed empty/missing files and syntax issues

- Fixed $(cat empty_files.txt | wc -l) empty files
- Created $(cat missing_files.txt | wc -l) missing critical files
- Node syntax errors: ${{ env.NODE_ERROR }}
- Python syntax errors: ${{ env.PYTHON_ERROR }}"
          git push origin main
          echo "✅ Changes pushed successfully."
        fi

    - name: 📊 Generate Job Summary
      if: always()
      run: |
        echo "## 🩺 Tamanna Auto‑Heal Report" >> $GITHUB_STEP_SUMMARY
        echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Empty files found**: ${{ steps.scan.outputs.EMPTY_COUNT }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Missing files found**: ${{ steps.scan.outputs.MISSING_COUNT }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Healing performed**: ${{ steps.scan.outputs.HEAL_NEEDED }}" >> $GITHUB_STEP_SUMMARY
        if [ -f empty_files.txt ]; then
          echo "### 📄 Empty files healed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat empty_files.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f missing_files.txt ]; then
          echo "### 🆕 Missing files created" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat missing_files.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: 📤 Upload Logs as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tamanna-heal-logs-${{ github.run_id }}
        path: |
          empty_files.txt
          missing_files.txt
          node_errors.log
          python_errors.log
        retention-days: 5

    - name: 🚨 Slack Notification (on failure or forced heal)
      if: (failure() || steps.scan.outputs.HEAL_NEEDED == 'true') && github.ref == 'refs/heads/main' && secrets.SLACK_WEBHOOK_URL != ''
      uses: rtCamp/action-slack-notify@v2
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SLACK_CHANNEL: '#alerts'
        SLACK_COLOR: ${{ job.status == 'success' && '#36a64f' || '#FF0000' }}
        SLACK_TITLE: "Tamanna Auto‑Heal ${{ job.status }}"
        SLACK_MESSAGE: |
          Repository: ${{ github.repository }}
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Healed: ${{ steps.scan.outputs.EMPTY_COUNT }} empty + ${{ steps.scan.outputs.MISSING_COUNT }} missing files

    - name: ✨ Done
      run: echo "🎉 Tamanna Auto‑Heal execution finished. Repository health restored."