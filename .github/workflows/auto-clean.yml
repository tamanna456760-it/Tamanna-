name: Tamanna Repository Cleanliness Audit - Manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - name: Report empty tracked files only
        run: |
          git ls-files -z | while IFS= read -r -d '' file; do
            if [ -f "$file" ] && [ ! -s "$file" ]; then
              printf 'EMPTY: %s\n' "$file"
            fi
          done
      - run: echo "No files were deleted, moved, or rewritten."
