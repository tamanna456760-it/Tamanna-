name: Tamanna Auto Heal Engine (Advanced)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (only scan, no changes)'
        type: boolean
        default: false
      deep_scan:
        description: 'Deep scan (check syntax of all code files)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🛠 Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck yamllint

      # ------------------------------------------------------------------
      # Cache for later language tools (optional)
      # ------------------------------------------------------------------
      - name: 💾 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 💾 Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # ------------------------------------------------------------------
      # 1) Comprehensive file scan
      # ------------------------------------------------------------------
      - name: 🔍 Scan repository for issues
        id: scan
        run: |
          mkdir -p reports
          echo "## 🔍 Auto Heal Scan Report" > reports/summary.md
          
          # Empty files
          find . -type f -size 0 -not -path "./.git/*" > reports/empty_files.txt
          EMPTY_COUNT=$(wc -l < reports/empty_files.txt)
          echo "- **Empty files**: $EMPTY_COUNT" >> reports/summary.md
          
          # Corrupted JSON
          > reports/bad_json.txt
          for f in $(find . -name "*.json" -not -path "./.git/*"); do
            if ! jq empty "$f" 2>/dev/null; then
              echo "$f" >> reports/bad_json.txt
            fi
          done
          BAD_JSON=$(wc -l < reports/bad_json.txt)
          echo "- **Corrupted JSON**: $BAD_JSON" >> reports/summary.md
          
          # Corrupted YAML
          > reports/bad_yaml.txt
          for f in $(find . -name "*.yaml" -o -name "*.yml" -not -path "./.git/*"); do
            if ! yamllint -d "{extends: relaxed, rules: {line-length: disable}}" "$f" 2>/dev/null; then
              echo "$f" >> reports/bad_yaml.txt
            fi
          done
          BAD_YAML=$(wc -l < reports/bad_yaml.txt)
          echo "- **Corrupted YAML**: $BAD_YAML" >> reports/summary.md
          
          # Missing critical files (optional)
          CRITICAL_FILES=("README.md" "LICENSE" ".gitignore")
          > reports/missing_critical.txt
          for file in "${CRITICAL_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "$file" >> reports/missing_critical.txt
            fi
          done
          MISSING_CRITICAL=$(wc -l < reports/missing_critical.txt)
          echo "- **Missing critical files**: $MISSING_CRITICAL" >> reports/summary.md
          
          # Save counts for later
          echo "EMPTY_COUNT=$EMPTY_COUNT" >> $GITHUB_OUTPUT
          echo "BAD_JSON=$BAD_JSON" >> $GITHUB_OUTPUT
          echo "BAD_YAML=$BAD_YAML" >> $GITHUB_OUTPUT
          echo "MISSING_CRITICAL=$MISSING_CRITICAL" >> $GITHUB_OUTPUT
          
          # Determine if any action needed
          if [ "$EMPTY_COUNT" -gt 0 ] || [ "$BAD_JSON" -gt 0 ] || [ "$BAD_YAML" -gt 0 ] || [ "$MISSING_CRITICAL" -gt 0 ]; then
            echo "HEAL_NEEDED=true" >> $GITHUB_OUTPUT
          else
            echo "HEAL_NEEDED=false" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------
      # 2) Auto‑heal empty files (smart content based on extension)
      # ------------------------------------------------------------------
      - name: 🩹 Fix empty files
        if: steps.scan.outputs.HEAL_NEEDED == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          echo "🩹 Fixing empty files..."
          while IFS= read -r file; do
            if [ -n "$file" ]; then
              echo "  → $file"
              case "$file" in
                *.md)      echo "# Auto‑generated by Tamanna Auto‑Heal" > "$file" ;;
                *.json)    echo "{}" > "$file" ;;
                *.yaml|*.yml) echo "# placeholder" > "$file" ;;
                *.py)      echo "# Auto‑generated stub\ndef main():\n    pass\n\nif __name__ == '__main__':\n    main()" > "$file" ;;
                *.js)      echo "// Auto‑generated stub\nconsole.log('Healed by Tamanna');" > "$file" ;;
                *.sh)      echo "#!/bin/bash\necho 'Healed by Tamanna'" > "$file"; chmod +x "$file" ;;
                *.html)    echo "<!DOCTYPE html><html><head><title>Healed</title></head><body></body></html>" > "$file" ;;
                *.css)     echo "/* Auto‑generated */\nbody { margin: 0; }" > "$file" ;;
                *)         echo "# Auto‑generated by Tamanna Auto‑Heal Engine" > "$file" ;;
              esac
            fi
          done < reports/empty_files.txt

      # ------------------------------------------------------------------
      # 3) Fix corrupted JSON and YAML
      # ------------------------------------------------------------------
      - name: 🔧 Fix corrupted JSON
        if: steps.scan.outputs.BAD_JSON > 0 && github.event.inputs.dry_run != 'true'
        run: |
          echo "🔧 Fixing corrupted JSON files..."
          while IFS= read -r file; do
            echo "  → $file"
            echo "{}" > "$file"
          done < reports/bad_json.txt

      - name: 🔧 Fix corrupted YAML
        if: steps.scan.outputs.BAD_YAML > 0 && github.event.inputs.dry_run != 'true'
        run: |
          echo "🔧 Fixing corrupted YAML files..."
          while IFS= read -r file; do
            echo "  → $file"
            echo "# placeholder" > "$file"
          done < reports/bad_yaml.txt

      # ------------------------------------------------------------------
      # 4) Create missing critical files
      # ------------------------------------------------------------------
      - name: 📄 Create missing critical files
        if: steps.scan.outputs.MISSING_CRITICAL > 0 && github.event.inputs.dry_run != 'true'
        run: |
          echo "📄 Creating missing critical files..."
          while IFS= read -r file; do
            echo "  → $file"
            case "$file" in
              README.md)  echo "# Project\n\nAuto‑maintained by Tamanna Auto‑Heal" > "$file" ;;
              LICENSE)    echo "MIT License\n\nCopyright (c) $(date +%Y) Tamanna" > "$file" ;;
              .gitignore) echo "# Python\n__pycache__/\n*.pyc\n# Node\nnode_modules/\n.env" > "$file" ;;
            esac
          done < reports/missing_critical.txt

      # ------------------------------------------------------------------
      # 5) Deep syntax checks (if enabled)
      # ------------------------------------------------------------------
      - name: 🧪 Deep syntax check (Python)
        if: github.event.inputs.deep_scan == 'true' && github.event.inputs.dry_run != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🐍 Python syntax validation
        if: github.event.inputs.deep_scan == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          echo "🔍 Checking Python syntax..."
          find . -name "*.py" -not -path "./.git/*" -exec python -m py_compile {} \; 2> reports/python_errors.log || true
          if [ -s reports/python_errors.log ]; then
            echo "⚠️ Python syntax errors found (logged but not auto-fixed)"
            cat reports/python_errors.log >> reports/summary.md
          fi

      - name: 📦 Node.js syntax check
        if: github.event.inputs.deep_scan == 'true' && github.event.inputs.dry_run != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🟢 JavaScript syntax validation
        if: github.event.inputs.deep_scan == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          echo "🔍 Checking JavaScript syntax..."
          find . -name "*.js" -not -path "./.git/*" -not -path "./node_modules/*" -exec node --check {} \; 2> reports/js_errors.log || true
          if [ -s reports/js_errors.log ]; then
            echo "⚠️ JavaScript syntax errors found (logged)"
            cat reports/js_errors.log >> reports/summary.md
          fi

      - name: 🐚 Shell script linting
        if: github.event.inputs.deep_scan == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          echo "🔍 Linting shell scripts..."
          find . -name "*.sh" -not -path "./.git/*" -exec shellcheck {} \; 2> reports/shell_errors.log || true
          if [ -s reports/shell_errors.log ]; then
            echo "⚠️ ShellCheck warnings found (logged)"
            cat reports/shell_errors.log >> reports/summary.md
          fi

      # ------------------------------------------------------------------
      # 6) Commit and push fixes (if not dry-run)
      # ------------------------------------------------------------------
      - name: 📝 Commit auto fixes
        if: steps.scan.outputs.HEAL_NEEDED == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name "Tamanna Auto Heal"
          git config --global user.email "auto@tamanna.ai"
          git add .
          if git diff --cached --quiet; then
            echo "✅ No changes to commit."
          else
            git commit -m "🤖 Auto‑Heal: Fixed empty/corrupted/missing files

- Empty files fixed: ${{ steps.scan.outputs.EMPTY_COUNT }}
- Corrupted JSON fixed: ${{ steps.scan.outputs.BAD_JSON }}
- Corrupted YAML fixed: ${{ steps.scan.outputs.BAD_YAML }}
- Missing critical files created: ${{ steps.scan.outputs.MISSING_CRITICAL }}"
            git push origin main
            echo "✅ Changes pushed."
          fi

      # ------------------------------------------------------------------
      # 7) Generate job summary & upload artifacts
      # ------------------------------------------------------------------
      - name: 📊 Generate job summary
        if: always()
        run: |
          echo "## 🩺 Tamanna Auto Heal Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry run**: ${{ github.event.inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deep scan**: ${{ github.event.inputs.deep_scan || 'true' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat reports/summary.md >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-heal-reports-${{ github.run_id }}
          path: reports/
          retention-days: 7

      # ------------------------------------------------------------------
      # 8) Slack notification on failure (optional)
      # ------------------------------------------------------------------
      - name: 🚨 Slack alert on issues
        if: (steps.scan.outputs.HEAL_NEEDED == 'true' || failure()) && github.ref == 'refs/heads/main' && secrets.SLACK_WEBHOOK_URL != ''
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: '#alerts'
          SLACK_COLOR: ${{ steps.scan.outputs.HEAL_NEEDED == 'true' && '#FFA500' || '#FF0000' }}
          SLACK_TITLE: 'Tamanna Auto Heal'
          SLACK_MESSAGE: |
            Repository: ${{ github.tamanna456760-it }}
            Run: https://github.com/${{ github.tamanna456760-it }}/actions/runs/${{ github.bd-king-r7 }}
            Empty files: ${{ steps.scan.outputs.EMPTY_COUNT }}
            Corrupted JSON: ${{ steps.scan.outputs.BAD_JSON }}
            Corrupted YAML: ${{ steps.scan.outputs.BAD_YAML }}
            Missing critical: ${{ steps.scan.outputs.MISSING_CRITICAL }}

      - name: ✨ Done
        run: echo "🎉 Tamanna Auto‑Heal execution finished."