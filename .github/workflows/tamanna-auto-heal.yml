name: Tamanna Auto Heal Engine

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Scan for Empty or Missing Files
      run: |
        echo "🔍 Scanning repository..."
        find . -type f -empty > empty_files.txt
        echo "⚠️ Empty files found:"
        cat empty_files.txt || true

    - name: Auto‑Generate Missing Content
      run: |
        while read file; do
          if [ -n "$file" ]; then
            echo "🛠 Fixing: $file"
            echo "# Auto‑generated by Tamanna Auto‑Heal Engine" > "$file"
          fi
        done < empty_files.txt

    - name: Fix Corrupted JSON Files
      run: |
        echo "🔍 Checking JSON files..."
        for f in $(find . -name "*.json"); do
          if ! jq empty "$f" 2>/dev/null; then
            echo "⚠️ Corrupted JSON detected: $f"
            echo "{}" > "$f"
          fi
        done

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: "18"

    - name: Node Syntax Check
      run: |
        if [ -f "package.json" ]; then
          echo "➡ Node project detected"
          npm install --silent || true
        fi

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Python Syntax Check
      run: |
        if [ -f "requirements.txt" ]; then
          echo "➡ Python project detected"
          pip install -r requirements.txt || true
        fi

    - name: Auto Commit Fixes
      run: |
        git config --global user.name "Tamanna Auto Heal"
        git config --global user.email "auto@tamanna.ai"
        git add .
        git commit -m "Auto‑Heal: Fixed missing/empty/corrupted files" || true
        git push || true

    - name: Done
      run: echo "✨ Tamanna Auto‑Heal Completed!"
