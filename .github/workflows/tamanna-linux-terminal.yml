name: Tamanna Linux Terminal

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Select a safe task for the temporary GitHub-hosted Linux runner"
        required: true
        type: choice
        options:
          - system-info
          - python-check
          - tests
          - repository-audit

permissions:
  contents: read

concurrency:
  group: tamanna-linux-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal:
    name: Tamanna Linux Terminal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize terminal
        shell: bash
        run: |
          set -euo pipefail
          echo "Tamanna Linux Terminal"
          echo "Runner: ${RUNNER_OS}"
          echo "Workspace: ${GITHUB_WORKSPACE}"
          uname -a
          python3 --version
          git --version

      - name: Execute selected task
        shell: bash
        env:
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          bash scripts/tamanna-linux-terminal.sh "$TASK"

      - name: Upload execution summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Tamanna Linux Terminal"
            echo "- Task: ${{ inputs.task }}"
            echo "- Ref: ${GITHUB_REF}"
            echo "- Runner: ${RUNNER_OS}"
            echo "- Result: see job steps above"
            echo ""
            echo "GitHub-hosted runners are temporary; this is not a persistent VPS shell."
          } >> "$GITHUB_STEP_SUMMARY"
