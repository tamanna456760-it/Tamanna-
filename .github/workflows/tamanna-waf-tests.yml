name: Tamanna AI - WAF Tests
on:
  push:
    branches:
      - main
    paths:
      - "waf/**"
      - ".github/workflows/tamanna-waf-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "waf/**"
      - ".github/workflows/tamanna-waf-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tamanna-waf-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  waf-tests:
    name: Run WAF Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: waf/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r waf/requirements.txt
      - name: Run WAF tests
        run: |
          python waf/run_tests.py