name: Tamanna Full Defense - Read Only Audit
on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
permissions:
  contents: read
concurrency:
  group: tamanna-full-defense-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit parser
        run: python -m pip install PyYAML
      - name: Run read-only repository audits
        run: |
          python scripts/audit_workflows.py
          python scripts/tamanna_full_audit.py
      - name: Check Python syntax
        env:
          PYTHONPYCACHEPREFIX: /tmp/tamanna-pycache
        run: |
          python -m compileall -q Main.py main.py tamanna_ai app_security api core data runner scripts tests
      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-full-defense-audit-${{ github.run_id }}
          path: |
            *.json
            *.md
            reports/
          if-no-files-found: ignore
          retention-days: 14
