name: Tamanna Full Defense Audit - Manual Read-Only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tamanna-full-defense-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python syntax and empty files
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          excluded = {".git", ".venv", "venv", "node_modules", "__pycache__", "backup"}
          errors, empty, count = [], [], 0
          for path in Path(".").rglob("*"):
              if any(part in excluded for part in path.parts) or not path.is_file():
                  continue
              if path.stat().st_size == 0:
                  empty.append(str(path))
              if path.suffix == ".py":
                  count += 1
                  try:
                      ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
                  except (OSError, UnicodeError, SyntaxError) as exc:
                      errors.append(f"{path}: {exc}")
          report = {"python_files_scanned": count, "empty_files": empty,
                    "python_syntax_errors": errors, "read_only": True}
          Path("tamanna-defense-audit.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False), encoding="utf-8")
          print(json.dumps(report, indent=2, ensure_ascii=False))
          if errors:
              raise SystemExit(1)
          PY
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-full-defense-audit
          path: tamanna-defense-audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Safety boundary
        run: echo "No five-minute schedule, backup copy, security log mutation, source rewrite, git push, or server operation."
