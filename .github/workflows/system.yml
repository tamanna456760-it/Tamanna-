system:
  name: Tamanna-Unified-AI-System
  mode: ultra

automation:
  issue_scan: true
  auto_fix: true
  system_monitor: true
  brain_core: true

github:
  workflows: true
  scripts: true

powerhub:
  enabled: true
  orchestrator: true
  sync_pipeline: true
  backend: true

services:
  web_backend: true
  web_frontend: true
  aspnet_site: true
  api_server: true
  chat_server: true
  mobile_app: true

security:
  integrity_watch: true
  defense_core: true
  network_defense: true
  self_defense: true

state:
  root_config: config.json
  reports: ai_report.json
  logs: ROOT/logs

flow:
  auto_trigger_ci: true
  self_heal: true
  ai_feedback_loop: true
