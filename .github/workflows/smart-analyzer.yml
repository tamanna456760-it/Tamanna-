
name: Tamanna Smart Analyzer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: python -m pip install --upgrade pip pytest

      - name: Validate analyzer files
        run: |
          test -f scripts/analyzer.py
          test -f scripts/fixer.py
          python -m py_compile \
            scripts/analyzer.py scripts/fixer.py

      - name: Run analyzer
        shell: bash
        env:
          TAMANNA_ANALYZER_REPORT: ${{ runner.temp }}/tamanna_analyzer_report.json
        run: |
          set +e
          python scripts/analyzer.py
          status=$?
          set -e

          if [ "$status" -gt 1 ]; then
            echo "Analyzer failed to complete."
            exit "$status"
          fi

      - name: Create review-only fix plan
        env:
          TAMANNA_ANALYZER_REPORT: ${{ runner.temp }}/tamanna_analyzer_report.json
          TAMANNA_FIXER_REPORT: ${{ runner.temp }}/tamanna_fix_plan.json
        run: python scripts/fixer.py

      - name: Run tests if present
        shell: bash
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "No tests directory; test step skipped."
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-smart-analyzer-report
          path: |
            ${{ runner.temp }}/tamanna_analyzer_report.json
            ${{ runner.temp }}/tamanna_fix_plan.json
          if-no-files-found: warn
          retention-days: 14
