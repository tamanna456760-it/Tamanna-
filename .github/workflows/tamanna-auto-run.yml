name: Tamanna API Smoke Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-api-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server.txt

      - name: Compile application entry points
        run: python -m py_compile Main.py main.py

      - name: Import application and check health route
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from Main import app

          client = TestClient(app)
          response = client.get("/health")
          assert response.status_code == 200, response.text
          print("PASS: Main FastAPI application imports and health route responds.")
          PY
