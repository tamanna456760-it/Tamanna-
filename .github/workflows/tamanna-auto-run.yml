name: Tamanna Runtime Smoke Test - Manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile entry points
        run: python -m compileall -q Main.py run_server.py tamanna_ai data modules tests scripts
      - name: Run project tests
        run: python -m pytest -q
      - run: echo "This job does not start a persistent production service or push code."
