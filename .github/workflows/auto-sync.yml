# ⚙️ 4. `.github/workflows/auto-sync.yml`

```yml
name: Auto Sync Tamanna System

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install watchdog

      - name: Run monitor (test mode)
        run: python monitor.py