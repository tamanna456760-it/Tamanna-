name: BD-King-R7 Safe Sync Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: bd-king-r7-safe-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Inspect repository without modifying it
        shell: bash
        run: |
          set -eu
          mkdir -p audit-report
          {
            echo "# BD-King-R7 Read-only Audit"
            echo
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- Branch: $GITHUB_REF_NAME"
            echo
            echo "## Working tree"
            git status --short
            echo
            echo "## Latest commit"
            git log -1 --oneline
            echo
            echo "## Python source count"
            find . -type f -name '*.py' \
              -not -path './.git/*' \
              -not -path '*/.venv/*' \
              -not -path '*/venv/*' \
              -not -path '*/node_modules/*' | wc -l
          } > audit-report/report.md

          cat audit-report/report.md
          echo "No fixer, git add, commit, push, or pull-request creation was run."

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bd-king-r7-audit-${{ github.run_id }}
          path: audit-report/
          if-no-files-found: warn
          retention-days: 7
