name: BD-King-R7 Read-Only Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: |
          python -m compileall -q runner/python tamanna_ai data modules
      - name: Report disabled mutation capabilities
        run: |
          echo "Automatic code rewriting, git push, and auto-PR creation are disabled."
          echo "This workflow is read-only."
