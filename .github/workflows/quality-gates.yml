name: Tamanna AI Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-ai-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: YAML, JSON and Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Validate GitHub workflow YAML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(
              p for p in Path(".github/workflows").rglob("*")
              if p.is_file() and p.suffix.lower() in {".yml", ".yaml"}
          )
          if not files:
              raise SystemExit("No GitHub Actions YAML files found")
          for path in files:
              with path.open(encoding="utf-8") as stream:
                  yaml.load(stream, Loader=yaml.BaseLoader)
              print(f"YAML OK: {path}")
          PY

      - name: Validate JSON files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ignored = {".git", ".venv", "venv", "node_modules", "build", "dist"}
          files = [
              p for p in Path(".").rglob("*.json")
              if not any(part in ignored for part in p.parts)
          ]
          failures = []
          for path in files:
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Validated {len(files)} JSON files")
          PY

      - name: Compile core Python entry points
        run: |
          python -m py_compile Main.py run_server.py
          if [ -d tamanna_ai ]; then python -m compileall -q tamanna_ai; fi
          if [ -d core ]; then python -m compileall -q core; fi
          if [ -d scripts ]; then python -m compileall -q scripts; fi

      - name: Run Python tests when present
        shell: bash
        run: |
          if [ -d tests ] && find tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pytest -q tests
          else
            echo "No pytest test files found; Python compilation checks passed."
          fi

      - name: Check shell script syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
            echo "Shell syntax OK: $file"
          done < <(find . -path './.git' -prune -o -path './node_modules' -prune -o -type f -name '*.sh' -print0)

  android-build:
    name: Android Debug and Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify canonical Android project
        run: |
          set -euo pipefail
          test -f tamanna-ai-app/settings.gradle
          test -f tamanna-ai-app/build.gradle
          test -f tamanna-ai-app/app/build.gradle
          test -f tamanna-ai-app/app/src/main/AndroidManifest.xml
          test -f tamanna-ai-app/app/src/build/java/com/tamanna/ai/TamannaWebActivity.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"

      - name: Install Android compile SDK
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list_installed | grep -E 'platforms;android-34|build-tools;34.0.0'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"
          validate-wrappers: false

      - name: Build Android variants
        working-directory: tamanna-ai-app
        run: |
          gradle --version
          gradle --no-daemon --stacktrace -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true assembleDebug assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tamanna-android-apks
          path: |
            tamanna-ai-app/app/build/outputs/apk/debug/*.apk
            tamanna-ai-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14


  docker-image:
    name: Backend Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Dockerfile and Compose contract
        run: |
          set -euo pipefail
          test -s Dockerfile
          test -s docker-compose.yml
          grep -F 'run_server:app' Dockerfile
          grep -F 'http://127.0.0.1:8000/health' docker-compose.yml

      - name: Build backend container image
        run: docker build --pull --tag tamanna-ai:ci .

  frontend-build:
    name: Frontend build and Node.js tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
            echo "JavaScript syntax OK: $file"
          done < <(find js scripts -type f -name '*.js' -print0 2>/dev/null)

      - name: Build GitHub Pages project site
        env:
          GITHUB_PAGES_BASE_PATH: Tamanna-
        run: npm run build

      - name: Validate frontend imports and entry points
        run: |
          node scripts/check-import-case.js
          npm run check

      - name: Run Node.js tests
        run: npm test

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-ai-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 14
