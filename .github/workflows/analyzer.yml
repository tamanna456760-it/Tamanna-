
name: Tamanna Advanced Code Analyzer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/analyzer.py"
      - "scripts/fixer.py"
      - ".github/workflows/analyzer.yml"
      - "**.py"
      - "**.json"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/analyzer.yml"
      - "**.py"
      - "**.json"

permissions:
  contents: read

concurrency:
  group: tamanna-analyzer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Read-only security and syntax scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify analyzer exists
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/analyzer.py")
          if not path.is_file():
              raise SystemExit("ERROR: scripts/analyzer.py is missing")
          print("PASS: scripts/analyzer.py exists")
          PY

      - name: Run Tamanna analyzer
        id: scan
        continue-on-error: true
        env:
          TAMANNA_ANALYZER_REPORT: ${{ runner.temp }}/tamanna_analyzer_report.json
        run: |
          python scripts/analyzer.py
          echo "analyzer_exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Build review-only fix plan
        if: always()
        env:
          TAMANNA_ANALYZER_REPORT: ${{ runner.temp }}/tamanna_analyzer_report.json
          TAMANNA_FIXER_REPORT: ${{ runner.temp }}/tamanna_fix_plan.json
        run: |
          if [ -f "$TAMANNA_ANALYZER_REPORT" ] && [ -f scripts/fixer.py ]; then
            python scripts/fixer.py
          else
            echo "Fix plan skipped: report or fixer.py is missing."
          fi

      - name: Upload analyzer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-analyzer-reports
          path: |
            ${{ runner.temp }}/tamanna_analyzer_report.json
            ${{ runner.temp }}/tamanna_fix_plan.json
          if-no-files-found: warn
          retention-days: 14

      - name: Report scan status
        if: always()
        run: |
          echo "Tamanna analyzer workflow finished."
          echo "Review the uploaded artifact for findings."
