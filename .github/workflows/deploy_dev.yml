name: Tamanna Dev Deployment - Disabled Unsafe Automation

on:
  workflow_dispatch:

# Safety mode: no source rewriting, repository writes, automatic pushes,
# remote deployment, or rollback commits. Review-only validation.
permissions:
  contents: read

concurrency:
  group: tamanna-dev-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Read-only Dev Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-server.txt ]; then
            python -m pip install -r requirements-server.txt
          elif [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "No requirements file found; syntax-only validation will run."
          fi

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          excluded = {".git", ".venv", "venv", "node_modules", "__pycache__"}
          failures = []
          count = 0

          for path in Path(".").rglob("*.py"):
              if any(part in excluded for part in path.parts):
                  continue
              count += 1
              try:
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except (SyntaxError, UnicodeDecodeError, OSError) as exc:
                  failures.append(f"{path}: {exc}")

          print(f"Scanned {count} Python files.")
          if failures:
              print("\\n".join(failures))
              raise SystemExit(1)
          print("PASS: Python syntax validation.")
          PY

      - name: Run tests when available
        run: |
          if [ -d tests ]; then
            python -m pytest -q tests
          else
            echo "No tests directory; pytest skipped."
          fi

      - name: Report safe mode
        if: always()
        run: |
          echo "This workflow did not modify or push repository files."
          echo "No deployment or rollback was performed."
