name: Dev Read-Only Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dev-read-only-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Read-only repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check whitespace errors
        run: git diff --check

      - name: Compile Python sources without writing bytecode
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import sys
          excluded = {".git", ".venv", "venv", "__pycache__", "node_modules"}
          failures = []
          checked = 0
          for path in pathlib.Path(".").rglob("*.py"):
              if any(part in excluded for part in path.parts):
                  continue
              checked += 1
              try:
                  compile(path.read_text(encoding="utf-8"), str(path), "exec")
              except (SyntaxError, UnicodeError, OSError) as exc:
                  failures.append(f"{path}: {exc}")
          print(f"Python files checked: {checked}")
          if failures:
              print("\n".join(failures))
              sys.exit(1)
          PY

      - name: Reject tracked private environment files
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import PurePosixPath

          tracked = subprocess.run(
              ["git", "ls-files", "-z"], check=True, capture_output=True
          ).stdout.decode("utf-8", "replace").split(chr(0))
          unsafe = []
          for name in tracked:
              if not name:
                  continue
              base = PurePosixPath(name).name
              if (base == ".env" or base.startswith(".env.")) and base != ".env.example":
                  unsafe.append(name)
          if unsafe:
              print("Tracked private environment files detected:")
              for name in unsafe:
                  print(f" - {name}")
              sys.exit(1)
          print("PASS: no tracked private environment files found.")
          PY

      - name: Scan tracked files for exposed credentials
        run: python scripts/security_secret_scan.py --root .

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi

      - name: Run security regression tests
        run: python -m pytest -q tests/test_access_control.py

      - name: Audit automatic Git mutation commands
        run: |
          python scripts/audit_git_mutations.py \
            --root . \
            --output "$RUNNER_TEMP/git-mutation-audit.json"

      - name: Inventory and review workflow directory
        run: |
          python scripts/audit_workflow_directory.py \
            --root .github/workflows \
            --output "$RUNNER_TEMP/workflow-directory-inventory.json"

      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-directory-inventory
          path: |
            ${{ runner.temp }}/workflow-directory-inventory.json
            ${{ runner.temp }}/git-mutation-audit.json
          if-no-files-found: warn
          retention-days: 14
