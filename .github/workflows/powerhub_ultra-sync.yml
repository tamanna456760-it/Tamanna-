name: BD-KING-R7 PowerHub Validation - Manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install server dependencies
        run: python -m pip install -r requirements-server.txt
      - name: Compile and test
        run: |
          python -m compileall -q Main.py run_server.py tamanna_ai data modules tests scripts
          python -m pytest -q
      - run: echo "No automatic build, source rewrite, or repository push was performed."
