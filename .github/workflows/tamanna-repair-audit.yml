
name: Tamanna Repository Repair Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: tamanna-repair-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Inspect and report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML validator
        run: python -m pip install PyYAML

      - name: Run Tamanna audit
        id: audit
        continue-on-error: true
        run: python scripts/tamanna_repo_repair.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-repair-audit-report
          path: tamanna_repair_report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if critical or high findings exist
        if: steps.audit.outcome == 'failure'
        run: |
          echo "Audit found critical/high issues, or failed."
          echo "Download the audit report and review the findings."
          exit 1
