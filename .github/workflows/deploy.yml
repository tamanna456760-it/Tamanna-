name: Tamanna Deployment Preflight

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-deployment-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-deployment:
    name: Validate Release and Container
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Deployment Configuration
        run: python deploy/preflight.py

      - name: Validate Release Files
        run: python deploy/validate_release.py

      - name: Prepare non-secret Compose validation environment
        shell: bash
        run: |
          set -Eeuo pipefail
          cp .env.example .env
          chmod 600 .env

      - name: Validate Docker Compose configuration
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Build production container without publishing
        run: docker build --pull --file Dockerfile --tag tamanna-ai:ci .

      - name: Remove temporary environment file
        if: always()
        run: rm -f .env
