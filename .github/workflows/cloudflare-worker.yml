name: Tamanna Cloudflare Worker CI

on:
  push:
    branches:
      - main
      - codex/cloudflare-worker-foundation
    paths:
      - "worker.js"
      - "Main.py"
      - "tamanna_ai/authentication/**"
      - "tests/**"
      - "requirements-server.txt"
      - "requirements-test.txt"
      - "wrangler.jsonc"
      - "scripts/build-static.js"
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-worker.yml"
  pull_request:
    branches:
      - main
    paths:
      - "worker.js"
      - "wrangler.jsonc"
      - "scripts/build-static.js"
      - "index.html"
      - "css/**"
      - "js/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build static website
        run: npm run build

      - name: Validate Worker JavaScript syntax
        run: cp worker.js /tmp/tamanna-worker.mjs && node --check /tmp/tamanna-worker.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Test privileged API route coverage
        run: python -m pytest -q tests/test_privileged_route_coverage.py tests/test_memory_persistence.py tests/test_memory_api_security.py tests/test_feature_flags.py

      - name: Validate Wrangler configuration and dry-run bundle
        run: npx --yes wrangler@4 deploy --dry-run --outdir=/tmp/tamanna-worker-dry-run

      - name: Verify generated website and Worker bundle
        run: |
          test -s dist/index.html
          test -d /tmp/tamanna-worker-dry-run
          find /tmp/tamanna-worker-dry-run -type f -name '*.js' -print -quit | grep -q .
          echo "PASS: static assets and Cloudflare Worker dry-run bundle exist."
