name: Tamanna JavaScript Safety Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.js"
      - ".github/workflows/auto_run.yml"
permissions:
  contents: read
concurrency:
  group: tamanna-js-safety-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax without executing project scripts
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find . -type d \( -name .git -o -name node_modules \) -prune -o -type f -name '*.js' -print0)
          echo "Validated JavaScript syntax in $count files."
          echo "No project JavaScript files were executed."
