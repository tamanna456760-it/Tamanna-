name: JavaScript Syntax Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-javascript:
    name: Parse-check tracked JavaScript (no execution)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JavaScript syntax
        run: python scripts/check_js_syntax.py

      - name: Validate repository entry points
        run: npm run build

      - name: Summary
        if: always()
        run: |
          {
            echo "## JavaScript validation"
            echo "- JavaScript files are syntax-checked only."
            echo "- Repository scripts are not executed automatically."
            echo "- Runtime tests must be added as explicit, isolated test cases."
          } >> "$GITHUB_STEP_SUMMARY"
