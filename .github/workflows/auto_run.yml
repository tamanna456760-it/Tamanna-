name: Tamanna JavaScript Inventory - Manual Safe Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check JavaScript without executing it
        run: |
          set -eu
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find . -type d \( -name .git -o -name node_modules \) -prune -o -type f -name '*.js' -print0)
          echo "JavaScript files syntax-checked: $count"
      - run: echo "JavaScript application files were not executed."
