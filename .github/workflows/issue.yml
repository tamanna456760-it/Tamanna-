- name: 🧹 Close Stale Issues & PRs (AI Optimized)
  uses: actions/stale@v10.3.0
  with:
    repo-token: ${{ secrets.GITHUB_TOKEN }}

    # 💬 Messages
    stale-issue-message: "⚠️ This issue is inactive. It will be closed soon if no update."
    stale-pr-message: "⚠️ This PR is inactive and marked as stale."

    close-issue-message: "❌ Closing issue due to inactivity. You can reopen anytime."
    close-pr-message: "❌ Closing PR due to inactivity."

    # ⏳ Timing control
    days-before-stale: 30
    days-before-close: 7

    # 🏷️ Labels
    stale-issue-label: "stale"
    stale-pr-label: "stale"

    # 🛡️ Protection rules
    exempt-issue-labels: "security,pinned,bug,priority"
    exempt-pr-labels: "security,pinned"

    # ⚡ Behavior tuning
    remove-stale-when-updated: true
    operations-per-run: 50
    debug-only: false

    # 📊 Logging
    enable-statistics: true

    # 🔥 Safety (optional but recommended)
    exempt-draft-pr: true