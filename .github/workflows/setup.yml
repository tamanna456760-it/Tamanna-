name: Tamanna Setup

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  setup:
    name: Setup Development Environment
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================================
      # SETUP PYTHON
      # ==========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      # ==========================================================
      # SETUP NODE.JS
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"


      # ==========================================================
      # SETUP .NET SDK
      # ==========================================================
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: "8.0.x"
          dotnet-quality: "ga"
          architecture: "x64"


      # ==========================================================
      # CHECK .NET
      # ==========================================================
      - name: Verify .NET
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Tamanna AI .NET Environment"
          echo "======================================"

          dotnet --version
          dotnet --info

          echo "======================================"
          echo ".NET SDK setup successful."
          echo "======================================"


      # ==========================================================
      # CHECK PYTHON
      # ==========================================================
      - name: Verify Python
        shell: bash
        run: |
          set -e

          python --version
          python -m pip --version


      # ==========================================================
      # CHECK NODE
      # ==========================================================
      - name: Verify Node.js
        shell: bash
        run: |
          set -e

          node --version
          npm --version


      # ==========================================================
      # DETECT .NET PROJECT
      # ==========================================================
      - name: Detect .NET Project
        shell: bash
        run: |
          set +e

          echo "Searching for .NET projects..."

          find . \
            -type f \
            \( \
              -name "*.sln" \
              -o \
              -name "*.slnx" \
              -o \
              -name "*.csproj" \
              -o \
              -name "*.fsproj" \
              -o \
              -name "*.vbproj" \
            \) \
            -not -path "./.git/*" \
            | sort \
            > dotnet_projects.txt

          if [ -s dotnet_projects.txt ]; then

            echo "======================================"
            echo ".NET projects found:"
            echo "======================================"

            cat dotnet_projects.txt

            echo "DOTNET_PROJECT_FOUND=true" \
              >> "$GITHUB_ENV"

          else

            echo "No .NET project found."

            echo "DOTNET_PROJECT_FOUND=false" \
              >> "$GITHUB_ENV"

          fi


      # ==========================================================
      # RESTORE .NET
      # ==========================================================
      - name: Restore .NET
        if: env.DOTNET_PROJECT_FOUND == 'true'
        shell: bash
        run: |
          set -e

          dotnet restore


      # ==========================================================
      # BUILD .NET
      # ==========================================================
      - name: Build .NET
        if: env.DOTNET_PROJECT_FOUND == 'true'
        shell: bash
        run: |
          set -e

          dotnet build \
            --configuration Release \
            --no-restore


      # ==========================================================
      # TEST .NET
      # ==========================================================
      - name: Test .NET
        if: env.DOTNET_PROJECT_FOUND == 'true'
        shell: bash
        run: |
          set -e

          dotnet test \
            --configuration Release \
            --no-build \
            --verbosity normal


      # ==========================================================
      # FINAL STATUS
      # ==========================================================
      - name: Setup Final Status
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo " Tamanna AI Setup"
          echo "======================================"
          echo ""
          echo "Python:"
          python --version
          echo ""
          echo "Node:"
          node --version
          echo ""
          echo ".NET:"
          dotnet --version
          echo ""
          echo "Setup completed."