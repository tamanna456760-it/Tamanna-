name: Tamanna Setup

on:
  workflow_dispatch:


jobs:
  setup:
    name: Setup Development Environment
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================================
      # SETUP PYTHON
      # ==========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      # ==========================================================
      # SETUP NODE.JS
      # ==========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"


      # ==========================================================
      # SETUP .NET SDK
      # ==========================================================
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: "8.0.x"
          dotnet-quality: "ga"
          architecture: "x64"


      # ==========================================================
      # CHECK .NET
      # ==========================================================
      - name: Verify .NET
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Tamanna AI .NET Environment"
          echo "======================================"

          dotnet --version
          dotnet --info

          echo "======================================"
          echo ".NET SDK setup successful."
          echo "======================================"


      # ==========================================================
      # CHECK PYTHON
      # ==========================================================
      - name: Verify Python
        shell: bash
        run: |
          set -e

          python --version
          python -m pip --version


      # ==========================================================
      # CHECK NODE
      # ==========================================================
      - name: Verify Node.js
        shell: bash
        run: |
          set -e

          node --version
          npm --version


      # ==========================================================
      # DETECT .NET PROJECT
      # ==========================================================
      - name: Detect .NET Project
        shell: bash
        run: |
          set +e

          echo "Searching for .NET projects..."

          find . \
            -type f \
            \( \
              -name "*.sln" \
              -o \
              -name "*.slnx" \
              -o \
              -name "*.csproj" \
              -o \
              -name "*.fsproj" \
              -o \
              -name "*.vbproj" \
            \) \
            -not -path "./.git/*" \
            | sort \
            > dotnet_projects.txt

          if [ -s dotnet_projects.txt ]; then

            echo "======================================"
            echo ".NET projects found:"
            echo "======================================"

            cat dotnet_projects.txt

            echo "DOTNET_PROJECT_FOUND=true" \
              >> "$GITHUB_ENV"

          else

            echo "No .NET project found."

            echo "DOTNET_PROJECT_FOUND=false" \
              >> "$GITHUB_ENV"

          fi


      # ==========================================================
      # RESTORE AND BUILD EACH .NET PROJECT
      # ==========================================================
      - name: Restore and Build .NET Projects
        if: env.DOTNET_PROJECT_FOUND == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          count=0
          while IFS= read -r -d '' project; do
            count=$((count + 1))
            echo "===== RESTORE: $project ====="
            dotnet restore "$project"
            echo "===== BUILD: $project ====="
            dotnet build "$project" --configuration Release --no-restore
          done < <(find . -type f -name '*.csproj' \
            -not -path '*/obj/*' -not -path '*/bin/*' -print0)
          test "$count" -gt 0
          echo "PASS: restored and built $count .NET project(s)"


      # ==========================================================
      # TEST .NET TEST PROJECTS WHEN PRESENT
      # ==========================================================
      - name: Test .NET Projects
        if: env.DOTNET_PROJECT_FOUND == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          tested=0
          while IFS= read -r -d '' project; do
            if grep -qE 'Microsoft.NET.Test.Sdk|<IsTestProject>true</IsTestProject>' "$project"; then
              echo "===== TEST: $project ====="
              dotnet test "$project" --configuration Release --no-build --verbosity normal
              tested=$((tested + 1))
            fi
          done < <(find . -type f -name '*.csproj' \
            -not -path '*/obj/*' -not -path '*/bin/*' -print0)
          echo "Test projects executed: $tested"


      # ==========================================================
      # FINAL STATUS
      # ==========================================================
      - name: Setup Final Status
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo " Tamanna AI Setup"
          echo "======================================"
          echo ""
          echo "Python:"
          python --version
          echo ""
          echo "Node:"
          node --version
          echo ""
          echo ".NET:"
          dotnet --version
          echo ""
          echo "Setup completed."