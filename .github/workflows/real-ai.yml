name: "Tamanna Offline Repository Scanner"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-offline-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Local static scan (no external AI API)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate scanner and formatter
        run: |
          test -s scripts/scan.py
          test -s scripts/ai_debugger.py
          python -m py_compile scripts/scan.py scripts/ai_debugger.py
          python -m unittest discover -s tests -p 'test_ai_debugger_offline.py' -v

      - name: Run offline static scan
        run: python scripts/scan.py

      - name: Build offline diagnostic summary
        run: python scripts/ai_debugger.py

      - name: Publish scan summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Tamanna offline repository scan"
            echo
            echo "This workflow performs local static checks only."
            echo "It does not call OpenAI, Gemini, or any hosted AI API."
            echo
            for file in report.txt ai_debugger_report.txt; do
              if [ -s "$file" ]; then
                echo "### $file"
                echo '~~~text'
                cat "$file"
                echo '~~~'
                echo
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload offline scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-offline-scan-reports
          path: |
            report.txt
            ai_debugger_report.txt
          if-no-files-found: warn
          retention-days: 7
