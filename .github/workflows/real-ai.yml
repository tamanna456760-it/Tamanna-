name: Tamanna AI Real AI Debugger

on:
  push:
    branches: ["main", "fix/**"]
    paths:
      - "Main.py"
      - "main.py"
      - "tamanna_ai/**"
      - "app_security/**"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-server.txt"
      - ".github/workflows/real-ai.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Main.py"
      - "main.py"
      - "tamanna_ai/**"
      - "app_security/**"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-server.txt"
      - ".github/workflows/real-ai.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-ai-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-debug:
    name: Scan and Review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai

      - name: Validate required files
        run: |
          test -f scripts/scan.py
          test -f scripts/ai_debugger.py

      - name: Run static code scanner
        run: python scripts/scan.py

      - name: Run AI debugger when API secret is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "AI debugger skipped: OPENAI_API_KEY repository secret is not configured."
          else
            python scripts/ai_debugger.py
          fi

      - name: Show scanner report
        if: always()
        run: |
          if [ -f report.txt ]; then cat report.txt; else echo "Scanner report was not generated."; fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-ai-debug-reports
          path: report.txt
          if-no-files-found: ignore
          retention-days: 7
