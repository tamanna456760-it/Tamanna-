name: "Tamanna Offline Repository Scanner"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-offline-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Local static scan (no external AI API)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate scanner
        run: |
          test -s scripts/scan.py
          python -m py_compile scripts/scan.py

      - name: Run offline static scan
        run: python scripts/scan.py

      - name: Publish scan summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Tamanna offline repository scan"
            echo
            echo "This workflow performs local static checks only."
            echo "It does not call OpenAI, Gemini, or any hosted AI API."
            echo
            if [ -s report.txt ]; then
              echo '~~~text'
              cat report.txt
              echo '~~~'
            else
              echo "No report was generated. Check the scanner step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload static scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-offline-scan-report
          path: report.txt
          if-no-files-found: warn
          retention-days: 7
