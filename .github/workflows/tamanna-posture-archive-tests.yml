name: Tamanna Posture Archive Security Tests
on:
  push:
    branches:
      - main
    paths:
      - "endpoint_security/**"
      - ".github/workflows/tamanna-posture-archive-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "endpoint_security/**"
      - ".github/workflows/tamanna-posture-archive-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tamanna-posture-archive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  posture-archive-tests:
    name: Validate Posture Archive Utilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator dependency
        run: |
          python -m pip install --disable-pip-version-check \
            "jsonschema>=4.20,<5.0"
      - name: Compile archive security modules
        run: |
          python -m py_compile \
            endpoint_security/posture_archive_index.py \
            endpoint_security/posture_archive_verifier.py \
            endpoint_security/posture_archive_policy.py \
            endpoint_security/posture_archive_preflight.py \
            endpoint_security/posture_archive_preflight_validator.py
      - name: Run archive index tests
        run: |
          python -m unittest \
            endpoint_security.tests.test_posture_archive_index -v
      - name: Run archive verifier tests
        run: |
          python -m unittest \
            endpoint_security.tests.test_posture_archive_verifier -v
      - name: Run archive policy tests
        run: |
          python -m unittest \
            endpoint_security.tests.test_posture_archive_policy -v
      - name: Run archive integration tests
        run: |
          python -m unittest \
            endpoint_security.tests.test_posture_archive_integration -v
      - name: Run archive preflight tests
        run: |
          python -m unittest \
            endpoint_security.tests.test_posture_archive_preflight -v
      - name: Run preflight validator tests
        run: |
          python -m unittest \
            endpoint_security.tests.test_posture_archive_preflight_validator -v