name: Tamanna AI - Endpoint Security Audit
on:
  push:
    branches:
      - main
    paths:
      - "endpoint_security/**"
      - ".github/workflows/tamanna-security-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "endpoint_security/**"
      - ".github/workflows/tamanna-security-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tamanna-security-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  endpoint-security-audit:
    name: Run Endpoint Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: endpoint_security/requirements.txt
      - name: Install endpoint security dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r endpoint_security/requirements.txt
      - name: Validate endpoint security configuration
        run: |
          python -m endpoint_security.config_validator
      - name: Run endpoint security unit tests
        run: |
          python -m unittest discover \
            -s endpoint_security/tests \
            -p "test_*.py"
      - name: Run security audit
        run: |
          python -m endpoint_security.security_audit
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-security-audit-report
          path: data/security_audits/*.json
          if-no-files-found: ignore
          retention-days: 14