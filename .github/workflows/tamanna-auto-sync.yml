
name: Tamanna Auto Sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository sync state
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Check repository structure
        shell: bash
        run: |
          set -eu

          for file in main.py Main.py requirements.txt; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file missing: $file"
              exit 1
            fi
            echo "PASS: $file"
          done

      - name: Check Python syntax
        run: python -m py_compile main.py Main.py

      - name: Report current commit
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"
          echo "Validation complete; no files were pushed or modified."
