name: Auto Fix and Build

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *" # every five minutes

jobs:
  auto-fix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install OS deps and Python dependencies
        run: |
          # Install common native deps to support optional packages (non-fatal)
          if command -v apt-get >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y libportaudio2 portaudio19-dev || true; fi
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt || true; fi
          # Optional native Python deps
          if [ -f requirements-optional.txt ]; then python -m pip install -r requirements-optional.txt || true; fi
      - name: Run auto-fix script
        run: |
          chmod +x scripts/auto_build_and_fix.sh || true
          bash scripts/auto_build_and_fix.sh
