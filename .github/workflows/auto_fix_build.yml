name: Tamanna Auto Fix - Read-Only Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-read-only-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python source without writing bytecode into repository
        env:
          PYTHONPYCACHEPREFIX: /tmp/tamanna-pycache
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          excluded = {".git", ".venv", "venv", "node_modules", "__pycache__"}
          failures = []
          scanned = 0
          for path in Path(".").rglob("*.py"):
              if any(part in excluded for part in path.parts):
                  continue
              try:
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
                  scanned += 1
              except (OSError, UnicodeError, SyntaxError) as exc:
                  failures.append(f"{path}: {exc}")
          print(f"Scanned Python files: {scanned}")
          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          print("PASS: Python syntax validation")
          PY

      - name: Verify project entry points
        run: |
          test -f Main.py
          test -f main.py
          test -f requirements-server.txt
          echo "PASS: Server entry points and server requirements exist."

      - name: Explicit safety boundary
        run: |
          echo "No formatter, fixer, package installer, source rewrite, git commit, or push was run."
