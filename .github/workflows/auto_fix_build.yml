name: Auto Fix and Build (Advanced)

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:        # manual trigger with options
    inputs:
      debug:
        description: 'Enable debug logging'
        type: boolean
        default: false
      skip_fix:
        description: 'Skip auto‑fix script'
        type: boolean
        default: false

# Cancel in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-fix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # needed for auto‑commit (if added later)

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'          # cache pip dependencies

      - name: 📦 Install OS dependencies (optional, non‑fatal)
        run: |
          echo "🔧 Installing optional system packages..."
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            # Group common native libs; failures ignored with '|| true'
            sudo apt-get install -y \
              libportaudio2 portaudio19-dev \
              libssl-dev libffi-dev build-essential \
            || true
          fi

      - name: 🐍 Install Python dependencies
        id: pip-install
        run: |
          echo "Installing from requirements.txt (if exists)..."
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt || true
          else
            echo "⚠️ No requirements.txt found – skipping."
          fi

          if [ -f requirements-optional.txt ]; then
            echo "Installing optional dependencies..."
            pip install -r requirements-optional.txt || true
          fi

          # Install common auto‑fix tools if missing
          pip install --upgrade autopep8 black flake8 pylint || true

      - name: 🔨 Ensure auto‑fix script exists
        run: |
          mkdir -p scripts
          if [ ! -f scripts/auto_build_and_fix.sh ]; then
            echo "⚠️ scripts/auto_build_and_fix.sh not found – creating a default one."
            cat > scripts/auto_build_and_fix.sh << 'EOF'
#!/bin/bash
set -e
echo "🔍 Running auto‑fix (Python formatting)"
autopep8 --in-place --recursive . --aggressive --aggressive 2>/dev/null || true
black . 2>/dev/null || true
echo "🏗️ Running build (if any)"
if [ -f setup.py ]; then python setup.py sdist bdist_wheel; fi
if [ -f pyproject.toml ]; then python -m build; fi
echo "✅ Auto‑fix and build completed."
EOF
            chmod +x scripts/auto_build_and_fix.sh
          fi

      - name: 🚀 Run auto-fix script (with retry)
        if: github.event.inputs.skip_fix != 'true'
        id: fix
        run: |
          echo "=== Starting auto-fix process ==="
          set +e
          MAX_RETRIES=2
          RETRY=0
          SCRIPT="scripts/auto_build_and_fix.sh"
          
          while [ $RETRY -lt $MAX_RETRIES ]; do
            echo "▶️ Execution attempt $((RETRY+1))"
            bash "$SCRIPT" 2>&1 | tee auto_fix.log
            if [ ${PIPESTATUS[0]} -eq 0 ]; then
              echo "✅ Auto-fix succeeded."
              exit 0
            fi
            RETRY=$((RETRY+1))
            if [ $RETRY -lt $MAX_RETRIES ]; then
              echo "⚠️ Failed, retrying in 5 seconds..."
              sleep 5
            fi
          done
          echo "❌ Auto-fix failed after $MAX_RETRIES attempts."
          exit 1

      - name: 📤 Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-fix-logs-${{ github.run_id }}
          path: |
            auto_fix.log
            scripts/auto_build_and_fix.sh
          retention-days: 7

      - name: 📊 Generate job summary
        if: always()
        run: |
          echo "## 🤖 Auto Fix & Build Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug mode**: ${{ github.event.inputs.debug || 'false' }}" >> $GITHUB_STEP_SUMMARY
          if [ -f requirements.txt ]; then
            echo "- **Requirements**: found" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Requirements**: missing (skipped)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.fix.outcome }}" == "success" ]; then
            echo "- **Auto‑fix status**: ✅ succeeded" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.fix.outcome }}" == "failure" ]; then
            echo "- **Auto‑fix status**: ❌ failed (see artifacts)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Auto‑fix status**: ⏭️ skipped" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🚨 Slack notification on failure (optional)
        if: failure() && github.ref == 'refs/heads/main' && secrets.SLACK_WEBHOOK_URL != ''
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: '#alerts'
          SLACK_COLOR: '#FF0000'
          SLACK_TITLE: 'Auto Fix & Build Failed'
          SLACK_MESSAGE: |
            Repository: ${{ github.repository }}
            Run: https://github.com/${{ github.tamanna456760-it }}/actions/runs/${{ github.tamanna- }}
            Branch: ${{ github.bd-king-r7  }}
            Trigger: ${{ github.bd-king-r7 }}

      - name: ✅ Completion message
        run: echo "🎉 Workflow finished. Check the summary above or artifacts for details."