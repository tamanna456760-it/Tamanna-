
name: Tamanna BD-KING-R7 - Safe Sync Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: tamanna-bd-king-r7-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Inspect Repository Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false

      - name: Audit repository state
        shell: bash
        run: |
          set -eu

          mkdir -p audit-report

          {
            echo "# Tamanna BD-KING-R7 Sync Audit"
            echo
            echo "- Branch: main"
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- Audit time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo
            echo "## Tracked file change summary"
            git status --short
            echo
            echo "## Latest commit summary"
            git log -1 --oneline
            echo
            echo "## Tracked file count"
            git ls-files | wc -l
          } > audit-report/sync-audit.md

          echo "Audit completed. No repository files were changed."

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-bd-king-r7-audit-${{ github.run_id }}
          path: audit-report/
          if-no-files-found: warn
          retention-days: 7
