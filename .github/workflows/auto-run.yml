name: Tamanna Python Inventory - Manual Safe Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse Python sources without executing them
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          excluded = {".git", ".venv", "venv", "node_modules", "__pycache__"}
          files = errors = 0
          for p in Path(".").rglob("*.py"):
              if any(part in excluded for part in p.parts):
                  continue
              files += 1
              try:
                  ast.parse(p.read_text(encoding="utf-8"), filename=str(p))
              except (OSError, UnicodeError, SyntaxError) as e:
                  errors += 1
                  print(f"FAIL {p}: {e}")
          print(f"Python files scanned: {files}; errors: {errors}")
          raise SystemExit(bool(errors))
          PY
      - run: echo "Application scripts were not executed."
