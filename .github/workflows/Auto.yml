name: Tamanna Ultimate Auto Build

on:
  push:
    branches:
      - tamanna-
      - develop
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'

  pull_request:
    branches:
      - tamanna-
      - develop

  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  JAVA_VERSION: "21"
  GO_VERSION: "1.22"

jobs:

  lint:
    name: Lint & Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node Dependencies
        if: hashFiles('package.json') != ''
        run: |
          npm install --no-audit --no-fund

      - name: Run ESLint
        if: hashFiles('package.json') != ''
        run: |
          npm run lint || echo "No lint script found"

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

          find . -name "*.sh" -exec shellcheck {} \; || true

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # NODE
      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Node Install
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: Node Test
        if: hashFiles('package.json') != ''
        run: |
          npm test || echo "No Node tests"

      # PYTHON
      - name: Setup Python
        if: hashFiles('requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python Packages
        if: hashFiles('requirements.txt') != ''
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        if: hashFiles('tests/**/*.py') != ''
        run: |
          pip install pytest
          pytest || true

      # JAVA
      - name: Setup Java
        if: hashFiles('pom.xml') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Maven Test
        if: hashFiles('pom.xml') != ''
        run: |
          mvn -B clean test

      # GO
      - name: Setup Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go Test
        if: hashFiles('go.mod') != ''
        run: |
          go mod download
          go test ./...

      # DOCKER
      - name: Docker Build Test
        if: hashFiles('Dockerfile') != ''
        run: |
          docker build -t tamanna-build:test .

      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/*.log
            **/test-results/**
            **/surefire-reports/**
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # CODEQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript,python,java,go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

      # TRIVY
      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      # DEPENDENCY REVIEW
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

      # TRUFFLEHOG
      - name: Scan Secrets
        uses: trufflesecurity/trufflehog@v3.90.0
        with:
          path: ./
          extra_args: --only-verified

      # SBOM
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.20.5
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  deploy:
    name: Deploy Tamanna Branch
    runs-on: ubuntu-latest
    needs: security

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/tamanna-'

    environment:
      name: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          echo "Deploying Tamanna Branch"
          echo "Add your deployment commands here"

  finalize:
    name: Final Summary
    runs-on: ubuntu-latest

    if: always()

    needs:
      - lint
      - build-test
      - security
      - deploy

    steps:
      - name: Summary
        run: |
          echo "# Tamanna Ultimate Auto Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Slack Notification
        if: failure() && github.event_name != 'pull_request'
        uses: rtCamp/action-slack-notify@v2.3.3
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: "#ff0000"
          SLACK_TITLE: "Tamanna Build Failed"

      - name: Email Notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Tamanna Build Failed"
          to: ${{ secrets.ALERT_EMAIL }}
          from: GitHub Actions
          body: |
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}

            Run URL:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}