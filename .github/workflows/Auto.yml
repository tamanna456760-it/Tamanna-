
name: Tamanna Ultimate Auto Build

on:
  push:
    branches: ["main", "develop"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: tamanna-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  lint:
    name: Lint and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          ignored = {".git", ".venv", "venv", "node_modules", "__pycache__"}
          failures = []

          for path in Path(".").rglob("*.py"):
              if any(part in ignored for part in path.parts):
                  continue
              try:
                  ast.parse(path.read_text(encoding="utf-8"))
              except (SyntaxError, UnicodeDecodeError) as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)

          print("PASS: Python syntax checks")
          PY

      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Node dependencies
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "WARNING: package-lock.json missing; dependency installation skipped."
          fi

      - name: Run Node tests
        if: hashFiles('package.json') != '' && hashFiles('package-lock.json') != ''
        run: |
          npm test --if-present

  python-test:
    name: Python Build and API Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          else
            echo "ERROR: requirements.txt is missing"
            exit 1
          fi

          python -m pip install pytest

      - name: Compile entry points
        run: |
          python -m py_compile main.py Main.py

      - name: Import FastAPI application
        run: |
          python -c "from main import app; print('PASS:', type(app).__name__)"

      - name: Run tests if present
        run: |
          if [ -d tests ]; then
            python -m pytest -q tests
          elif [ -d test ]; then
            python -m pytest -q test
          else
            echo "No test directory found; skipping pytest."
          fi

      - name: Start API and verify
        run: |
          set -eu

          python -m uvicorn main:app \
            --host 127.0.0.1 \
            --port 8000 \
            > tamanna-api.log 2>&1 &
          PID=$!

          trap 'kill "$PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:8000/openapi.json \
              -o /tmp/tamanna-openapi.json; then
              echo "PASS: Tamanna API started"
              exit 0
            fi

            if ! kill -0 "$PID" 2>/dev/null; then
              cat tamanna-api.log
              exit 1
            fi

            sleep 2
          done

          cat tamanna-api.log
          echo "ERROR: API did not become ready"
          exit 1

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-api-diagnostics
          path: tamanna-api.log
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Basic Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check for accidentally committed secrets
        shell: bash
        run: |
          set -eu

          python - <<'PY'
          from pathlib import Path
          import re

          ignored = {
              ".git", ".venv", "venv", "node_modules",
              "__pycache__", ".pytest_cache"
          }
          sensitive_names = {
              ".env", "credentials.json", "token.txt",
              "id_rsa", "id_ed25519"
          }
          problems = []

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in ignored for part in path.parts):
                  continue
              if path.name in sensitive_names:
                  problems.append(f"Review sensitive filename: {path}")
                  continue

              if path.suffix not in {".py", ".js", ".json", ".yml", ".yaml", ".toml"}:
                  continue

              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              patterns = [
                  r"(?i)AIza[0-9A-Za-z_-]{30,}",
                  r"(?i)-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
                  r"(?i)(?:api[_-]?key|secret[_-]?key)\s*[:=]\s*['\"][^'\"]{12,}['\"]",
              ]

              for pattern in patterns:
                  if re.search(pattern, content):
                      problems.append(f"Possible secret found: {path}")
                      break

          if problems:
              print("\n".join(problems))
              print("Review these files manually; no files were changed.")
              raise SystemExit(1)

          print("PASS: No matching secret patterns found.")
          PY

      - name: Check GitHub workflow artifact versions
        shell: bash
        run: |
          if grep -R -n \
            --include='*.yml' \
            --include='*.yaml' \
            'actions/upload-artifact@v3' .github/workflows; then
            echo "ERROR: Replace upload-artifact v3 with v4."
            exit 1
          fi

          echo "PASS: No upload-artifact v3 references found."

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [lint, python-test, security]
    if: always()

    steps:
      - name: Write summary
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          PYTHON_RESULT: ${{ needs.python-test.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          {
            echo "## Tamanna AI Build Summary"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Lint | $LINT_RESULT |"
            echo "| Python/API | $PYTHON_RESULT |"
            echo "| Security | $SECURITY_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$LINT_RESULT" != success ] ||
             [ "$PYTHON_RESULT" != success ] ||
             [ "$SECURITY_RESULT" != success ]; then
            exit 1
          fi
