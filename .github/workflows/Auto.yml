name: Tamanna Ultimate Auto Build

on:
  push:
    branches: [ "tamanna-", "develop" ]
    paths:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "tamanna-", "develop" ]
  schedule:
    - cron: '0 2 * * *'   # daily 2 AM build
  workflow_dispatch:        # manual trigger

# Cancel previous running workflows on same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 18
  PYTHON_VERSION: "3.11"
  JAVA_VERSION: 17
  GO_VERSION: "1.21"
  DOCKER_REGISTRY: ghcr.io

jobs:
  # ---------- 1. Lint & Format (fast, early failure) ----------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run linters
        run: |
          if [ -f "package.json" ]; then
            npm install --no-audit --no-fund
            npm run lint 2>/dev/null || echo "⚠️ No lint script found"
          fi
      - name: Run ShellCheck on scripts
        run: |
          if command -v shellcheck &>/dev/null; then
            find . -name "*.sh" -exec shellcheck {} \;
          fi

  # ---------- 2. Build & Test (matrix for multiple versions) ----------
  build-test:
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix:
        node-version: [18, 20]
        python-version: ["3.10", "3.11"]
        java-version: [17, 21]
      fail-fast: false   # test all combinations, collect results
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for better caching

      # ---------- Node.js ----------
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Node dependencies
        if: hashFiles('package.json') != ''
        run: npm ci --no-audit --no-fund

      - name: Run Node tests
        if: hashFiles('package.json') != ''
        run: |
          npm test 2>/dev/null || echo "No test script, skipping"

      # ---------- Python ----------
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install Python dependencies
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt

      - name: Run Python tests
        if: hashFiles('pytest.ini') != '' || hashFiles('tests/') != ''
        run: |
          pip install pytest
          pytest --junitxml=pytest.xml

      # ---------- Java / Maven ----------
      - name: Setup Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      - name: Maven build & test
        if: hashFiles('pom.xml') != ''
        run: mvn -B clean compile test --file pom.xml

      # ---------- Go (if go.mod exists) ----------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Go build & test
        if: hashFiles('go.mod') != ''
        run: |
          go mod download
          go test -v ./...

      # ---------- Docker build test (if Dockerfile exists) ----------
      - name: Docker build test
        if: hashFiles('Dockerfile') != ''
        run: docker build -t test-image .

      # ---------- Upload test artifacts on failure ----------
      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs-${{ matrix.node-version }}-${{ matrix.python-version }}
          path: |
            **/target/surefire-reports/
            **/test-results/
            **/pytest.xml
            **/logs/
          retention-days: 7

  # ---------- 3. Security Scanning (CodeQL + Trivy + Secrets) ----------
  security:
    runs-on: ubuntu-latest
    needs: [build-test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # CodeQL analysis
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, python, java, go
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # Trivy filesystem scan (vulnerabilities + misconfigurations)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      # Secret scanning (trufflehog)
      - name: Run TruffleHog for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --no-verification --only-verified

      # Dependency review (only on PRs)
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

      # Generate SBOM (Software Bill of Materials)
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

  # ---------- 4. Deployment (only on push to main, after all success) ----------
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging   # requires environment protection rules
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment"
          # Add your actual deployment script here
          # e.g., ./deploy.sh staging

  # ---------- 5. Final summary & notifications ----------
  finalize:
    runs-on: ubuntu-latest
    needs: [lint, build-test, security, deploy-staging]
    if: always()   # always run to show summary
    steps:
      - name: Generate job summary
        run: |
          echo "## 🚀 Tamanna Ultimate Auto Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} | ${{ needs.lint.outputs.duration }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-test.result }} | ${{ needs.build-test.outputs.duration }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result }} | ${{ needs.security.outputs.duration }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Staging | ${{ needs.deploy-staging.result }} | ${{ needs.deploy-staging.outputs.duration }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Tamanna Auto Sync Completed Successfully!**" >> $GITHUB_STEP_SUMMARY

      - name: Send Slack notification on failure
        if: failure() && github.event_name != 'pull_request'
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: '#ff0000'
          SLACK_TITLE: 'Build Failed'
          SLACK_MESSAGE: |
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Run: ${{ github.run_id }}
            Failed jobs: ${{ join(needs.*.result, ', ') }}

      - name: Send email on failure (optional)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Tamanna Build Failed - ${{ github.repository }}"
          to: ${{ secrets.ALERT_EMAIL }}
          from: GitHub Actions
          body: |
            Build failed for ${{ github.repository }}.
            See logs: https://github.com/${{ github.com/tamanna456760-it/tamanna- }}/actions/runs/${{ github.run_id }}