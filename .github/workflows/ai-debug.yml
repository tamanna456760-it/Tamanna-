name: 🚀 AI Debug System

on:
push:
branches:
- main
pull_request:

permissions:
contents: read

jobs:
debug:
runs-on: ubuntu-latest

steps:
  - name: 📥 Checkout
    uses: actions/checkout@v4

  - name: 🐍 Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
      cache: "pip"

  - name: 📦 Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install pytest flake8

  - name: 🔍 Lint Check
    run: |
      flake8 . || true

  - name: 🧠 Run Analyzer
    run: |
      python scripts/analyzer.py

  - name: 🤖 Run AI Fixer
    run: |
      python scripts/fixer.py

  - name: 📊 Show Report
    run: |
      cat final_report.txt || echo "No report generated"

  - name: 📁 Upload Report
    uses: actions/upload-artifact@v4
    with:
      name: ai-debug-report
      path: final_report.txt
      if-no-files-found: warn
      retention-days: 7