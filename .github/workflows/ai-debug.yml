name: Tamanna AI Debug and Fix Plan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-ai-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Read-only analyzer and fix plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install critical lint checker
        run: python -m pip install flake8

      - name: Check analyzer modules
        run: |
          python -m py_compile scripts/analyzer.py scripts/fixer.py
          flake8 --select=E9,F63,F7,F82 scripts/analyzer.py scripts/fixer.py

      - name: Run read-only analyzer
        id: analyzer
        continue-on-error: true
        env:
          TAMANNA_ANALYZER_REPORT: /tmp/tamanna_analyzer_report.json
        run: python scripts/analyzer.py

      - name: Generate review-only fix plan
        env:
          TAMANNA_ANALYZER_REPORT: /tmp/tamanna_analyzer_report.json
          TAMANNA_FIXER_REPORT: /tmp/tamanna_fixer_report.json
        run: python scripts/fixer.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-ai-debug-reports
          path: |
            /tmp/tamanna_analyzer_report.json
            /tmp/tamanna_fixer_report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Report analyzer findings
        if: steps.analyzer.outcome == 'failure'
        run: echo "Analyzer reported findings; inspect the uploaded report. No source files were changed."
