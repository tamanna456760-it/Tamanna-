name: 🚀 AI Debug System

on:
  push:
  pull_request:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 📦 Install
        run: |
          pip install pytest flake8

      - name: 🔍 Lint Check
        run: flake8 . || true

      - name: 🧠 Run Analyzer
        run: python scripts/analyzer.py

      - name: 🤖 Run AI Fixer
        run: python scripts/fixer.py

      - name: 📊 Show Report
        run: cat final_report.txt || true

      - name: 📁 Upload Report
        uses: actions/upload-artifact@v3
        with:
          name: ai-debug-report
          path: final_report.txt