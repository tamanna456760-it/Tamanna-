name: Tamanna AI IDS Tests
on:
  push:
    paths:
      - "ids/**"
      - ".github/workflows/tamanna-ids-tests.yml"
  pull_request:
    paths:
      - "ids/**"
      - ".github/workflows/tamanna-ids-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tamanna-ids-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: IDS Tests and Safety Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ids/requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r ids/requirements-dev.txt
      - name: Validate IDS configuration
        run: python -m ids.ids_cli config
      - name: Run IDS tests
        run: python -m unittest discover -s ids/tests -p "test_*.py" -v
      - name: Validate IDS project safety
        run: python -m ids.validate_project