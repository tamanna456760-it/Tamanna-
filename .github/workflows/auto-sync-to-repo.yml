
name: Tamanna Sync Safety Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Create sync report
        shell: bash
        run: |
          set -eu

          {
            echo "# Tamanna Sync Safety Report"
            echo
            echo "Current commit:"
            git log -1 --oneline
            echo
            echo "Working tree:"
            git status --short
            echo
            echo "Submodules:"
            git submodule status || true
          } > tamanna-sync-report.md

          cat tamanna-sync-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-sync-safety-report
          path: tamanna-sync-report.md
          if-no-files-found: warn
          retention-days: 14
