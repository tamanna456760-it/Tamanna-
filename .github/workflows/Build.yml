name: Tamanna AI Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Python and Node.js Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install Python runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Validate all Python, Bash, JSON, and YAML files
        run: python scripts/validate_repository.py

      - name: Run Python test suite
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate Node.js manifest files
        run: |
          node -e "const fs=require('node:fs'); for (const f of ['package.json','package-lock.json']) JSON.parse(fs.readFileSync(f,'utf8')); console.log('PASS: Node manifests are valid JSON')"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run Node.js tests
        run: npm test

      - name: Run Node.js build check
        run: npm run build

      - name: Verify server entry points
        run: |
          test -f Main.py
          test -f run_server.py
          test -f requirements-server.txt
          test -f requirements-test.txt
          echo "PASS: Tamanna AI entry-point and dependency files found."
