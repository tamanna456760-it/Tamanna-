Tamanna AI - Python Build and Syntax Check

name: Tamanna AI Build

on:
push:
branches: [main]
pull_request:
branches: [main]
workflow_dispatch:

permissions:
contents: read

jobs:
python-build:
name: Python Syntax Check
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"
  - name: Check Python syntax
    run: |
      python -m compileall -q Main.py main.py scripts tamanna_ai
      
  - name: Verify server entry points
    run: |
      test -f Main.py
      test -f main.py
      echo "Tamanna AI entry-point files found."
  - name: Check Node project files without failing Python build
    run: |
      if [ -f package.json ] && [ -f package-lock.json ]; then
        echo "Root Node.js project detected."
      else
        echo "No complete root Node.js project; skipping npm commands."
      fi