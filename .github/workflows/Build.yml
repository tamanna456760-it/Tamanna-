name: Tamanna AI Server CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server.txt
          python -m pip install -r requirements-test.txt

      - name: Compile every tracked Python file with NUL-safe paths
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! python -m py_compile "$file"; then
              echo "FAIL $file"
              failed=1
            fi
          done < <(git ls-files -z '*.py')
          echo "Python files checked: $count"
          test "$failed" -eq 0
          echo "PASS: tracked Python compilation"

      - name: Check all tracked shell scripts
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! bash -n "$file"; then
              echo "FAIL $file"
              failed=1
            fi
          done < <(git ls-files -z '*.sh')
          echo "Shell files checked: $count"
          test "$failed" -eq 0
          echo "PASS: tracked Bash syntax"

      - name: Parse all tracked JSON files
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          names = subprocess.check_output(["git", "ls-files", "-z", "*.json"]).decode().split("\0")
          checked = 0
          errors = []
          for name in filter(None, names):
              if name.rsplit("/", 1)[-1].startswith("tsconfig"):
                  print("SKIP comment-style config:", name)
                  continue
              try:
                  with open(name, encoding="utf-8") as stream:
                      json.load(stream)
                  checked += 1
              except Exception as exc:
                  errors.append((name, str(exc)))
          print("JSON files checked:", checked)
          for name, error in errors:
              print(f"FAIL {name}: {error}")
          if errors:
              sys.exit(1)
          print("PASS: tracked JSON parse")
          PY

      - name: Verify mandatory server dependencies
        run: python scripts/check_server_dependencies.py

      - name: Import Main
        env:
          TAMANNA_ENV: test
          TAMANNA_MODEL_PROVIDER: mock
          TAMANNA_SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
          TAMANNA_COOKIE_SECURE: "0"
        run: python -c "import Main; print('Main import passed')"

      - name: Run tests
        env:
          TAMANNA_ENV: test
          TAMANNA_MODEL_PROVIDER: mock
          TAMANNA_SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
          TAMANNA_COOKIE_SECURE: "0"
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build --tag tamanna-ai:ci .

      - name: Start Docker server and smoke-test health and chat
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            'TAMANNA_ENV=test' \
            'TAMANNA_MODEL_PROVIDER=mock' \
            'TAMANNA_DATABASE_URL=sqlite:////tmp/tamanna-ci.sqlite3' \
            'TAMANNA_SESSION_SECRET=ci-only-session-secret-with-at-least-32-characters' \
            'TAMANNA_COOKIE_SECURE=0' \
            'TAMANNA_ADMIN_EMAIL=ci-admin@example.invalid' \
            'TAMANNA_CORS_ORIGINS=http://127.0.0.1:8000' \
            'TAMANNA_MAX_REQUEST_BYTES=1048576' > .env.ci
          cleanup() {
            docker logs tamanna-ci || true
            docker rm -f tamanna-ci >/dev/null 2>&1 || true
            rm -f .env.ci .ci-cookies.txt
          }
          trap cleanup EXIT
          docker run -d --name tamanna-ci --env-file .env.ci -p 8000:8000 tamanna-ai:ci
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          echo
          curl -fsS -c .ci-cookies.txt -X POST http://127.0.0.1:8000/api/auth/signup \
            -H 'Content-Type: application/json' \
            --data '{"email":"ci-user@example.invalid","name":"CI User","password":"ci-test-password-123"}'
          echo
          curl -fsS -b .ci-cookies.txt -c .ci-cookies.txt -X POST http://127.0.0.1:8000/api/chat \
            -H 'Content-Type: application/json' \
            --data '{"message":"CI smoke test"}'
          echo
          curl -fsS -b .ci-cookies.txt http://127.0.0.1:8000/api/history
          echo
          echo "PASS: Docker /health, authenticated /api/chat, and /api/history"
