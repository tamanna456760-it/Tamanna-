name: Tamanna AI Server Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Python, tests, Docker and HTTP smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install server and test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Compile each tracked Python file (space-safe)
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! python -m py_compile "$file"; then
              echo "FAIL $file"
              failed=1
            fi
          done < <(git ls-files -z '*.py')
          echo "Python files checked: $count"
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "PASS: every tracked Python file compiled."

      - name: Check every tracked shell script
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          count=0
          while IFS= read -r -d '' file; do
            count=$((count + 1))
            if ! bash -n "$file"; then
              echo "FAIL $file"
              failed=1
            fi
          done < <(git ls-files -z '*.sh')
          echo "Shell files checked: $count"
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "PASS: every tracked shell script passed bash -n."

      - name: Parse every tracked JSON file
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          paths = subprocess.check_output(["git", "ls-files", "-z", "*.json"]).decode().split("\0")
          checked = 0
          failures = []
          for name in filter(None, paths):
              if name.rsplit("/", 1)[-1].startswith("tsconfig"):
                  print("SKIP comment-style config:", name)
                  continue
              try:
                  with open(name, encoding="utf-8") as handle:
                      json.load(handle)
                  checked += 1
              except Exception as exc:
                  failures.append((name, str(exc)))
          print("JSON files checked:", checked)
          for name, error in failures:
              print(f"FAIL {name}: {error}")
          if failures:
              sys.exit(1)
          print("PASS: all tracked JSON files are valid.")
          PY

      - name: Check mandatory server import dependencies
        run: python scripts/check_server_dependencies.py

      - name: Import Main application
        env:
          TAMANNA_ENV: test
          TAMANNA_MODEL_PROVIDER: mock
          TAMANNA_SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
          TAMANNA_COOKIE_SECURE: "0"
        run: python -c "import Main; print('PASS: Main.app imported')"

      - name: Run Python tests
        env:
          TAMANNA_ENV: test
          TAMANNA_MODEL_PROVIDER: mock
          TAMANNA_SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
          TAMANNA_COOKIE_SECURE: "0"
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build --tag tamanna-ai:ci .

      - name: Run container with a test-only environment file
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > .env.ci <<'EOF'
          TAMANNA_ENV=test
          TAMANNA_MODEL_PROVIDER=mock
          TAMANNA_DATABASE_URL=sqlite:////tmp/tamanna-ci.sqlite3
          TAMANNA_SESSION_SECRET=ci-only-session-secret-with-at-least-32-characters
          TAMANNA_COOKIE_SECURE=0
          TAMANNA_ADMIN_EMAIL=ci-admin@example.invalid
          TAMANNA_CORS_ORIGINS=http://127.0.0.1:8000
          TAMANNA_MAX_REQUEST_BYTES=1048576
          EOF
          docker run -d --name tamanna-ci --env-file .env.ci -p 8000:8000 tamanna-ai:ci
          cleanup() {
            docker logs tamanna-ci || true
            docker rm -f tamanna-ci >/dev/null 2>&1 || true
            rm -f .env.ci
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "FAIL: container health endpoint did not become ready."
            exit 1
          fi
          echo
          curl -fsS -X POST http://127.0.0.1:8000/api/chat \
            -H 'Content-Type: application/json' \
            --data '{"message":"CI smoke test"}'
          echo
          echo "PASS: Docker /health and /api/chat smoke tests completed."
