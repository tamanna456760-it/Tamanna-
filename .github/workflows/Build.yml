name: Build

on:
push:
branches:
- main
pull_request:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

strategy:
  matrix:
    node-version: [20]

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: ${{ matrix.node-version }}
      cache: npm

  - name: Install Dependencies
    run: npm ci

  - name: Run Tests
    run: npm test

  - name: Build Project
    run: npm run build