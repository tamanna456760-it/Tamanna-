finalize:
  name: 🚀 Final Build Summary
  runs-on: ubuntu-latest
  needs: [lint, build-test, security]
  if: always()

  steps:
    - name: Generate Summary Report
      shell: bash
      run: |
        echo "## 🚀 Tamanna CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY

        LINT_STATUS="${{ needs.lint.result }}"
        BUILD_STATUS="${{ needs.build-test.result }}"
        SECURITY_STATUS="${{ needs.security.result }}"

        echo "| Lint | $LINT_STATUS |" >> $GITHUB_STEP_SUMMARY
        echo "| Build & Test | $BUILD_STATUS |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Scan | $SECURITY_STATUS |" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY

        # Overall status logic
        if [[ "$LINT_STATUS" == "failure" || "$BUILD_STATUS" == "failure" || "$SECURITY_STATUS" == "failure" ]]; then
          echo "❌ **Pipeline Result: FAILED**" >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "✅ **Pipeline Result: SUCCESS**" >> $GITHUB_STEP_SUMMARY
        fi