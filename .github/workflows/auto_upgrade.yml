name: Tamanna Read-only System Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: tamanna-readonly-system-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Static repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile tracked Python sources
        shell: bash
        run: |
          set -eu
          git ls-files -z '*.py' |
          while IFS= read -r -d '' file; do
            python -m py_compile "$file"
          done

      - name: Validate repository metadata
        shell: bash
        run: |
          set -eu
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Tracked files: $(git ls-files | wc -l)"
          echo "This workflow does not upgrade dependencies, launch the app, or write to Git."

      - name: Upload audit summary
        if: always()
        run: |
          {
            echo "# Tamanna Static Audit"
            echo
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- Python compilation: completed if this step succeeded"
            echo "- Dependency upgrades: disabled"
            echo "- Application execution: disabled"
            echo "- Git write/push: disabled"
          } > tamanna-audit-summary.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tamanna-static-audit-${{ github.run_id }}
          path: tamanna-audit-summary.md
          if-no-files-found: warn
          retention-days: 7
