name: Tamanna System Review - Manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static Python syntax audit
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          skip = {".git", ".venv", "venv", "node_modules", "__pycache__"}
          errors = []
          count = 0
          for p in Path(".").rglob("*.py"):
              if any(x in skip for x in p.parts):
                  continue
              try:
                  ast.parse(p.read_text(encoding="utf-8"), filename=str(p))
                  count += 1
              except (OSError, UnicodeError, SyntaxError) as e:
                  errors.append(f"{p}: {e}")
          print(f"Scanned: {count}")
          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          PY
      - run: echo "Automatic upgrades and all repository writes are disabled."
