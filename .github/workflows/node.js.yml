name: Git Auto Build & Workflow (Safe Mode)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # Node optional
    - name: Setup Node.js (optional)
      if: exists('package.json')
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    # Python optional
    - name: Setup Python (optional)
      if: exists('requirements.txt')
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies (safe)
      run: |
        echo "Installing dependencies if available..."

        if [ -f package.json ]; then
          npm install || true
        fi

        if [ -f requirements.txt ]; then
          pip install -r requirements.txt || true
        fi

    - name: Build Project (safe)
      run: |
        echo "Building project safely..."

        if [ -f package.json ]; then
          npm run build || true
        fi

        if [ -f build.py ]; then
          python build.py || true
        fi

    - name: Auto Commit Build Files
      run: |
        git config user.name "tamanna456760-it"
        git config user.email "tamanna456760@gmail.com"

        git add .
        git commit -m "Auto Build Update (safe)" || echo "No files changed"
        git push || echo "Push skipped"