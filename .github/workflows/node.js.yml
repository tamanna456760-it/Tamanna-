name: BD-KING-R7 AI Auto Build & Sync

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "*/10 * * * *"   # প্রতি 10 মিনিটে auto update
  workflow_dispatch:

jobs:
  auto:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies (if any)
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    - name: Run Build Script
      run: |
        if [ -f build.py ]; then
          python build.py
        fi

    - name: Auto Commit Build
      run: |
        git config user.name "tamanna456760-it"
        git config user.email "tamanna456760@gmail.com"
        git add .
        git commit -m "BD-KING-R7 Auto Build Update" || echo "No changes"
        git push || echo "Push failed"