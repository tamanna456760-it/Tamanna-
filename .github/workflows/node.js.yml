name: BD-KING-R7 Build Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate Python entry points
        run: python -m compileall -q Main.py run_server.py runner/python tamanna_ai data modules
      - name: Report
        run: echo "No automatic git add, commit, or push is permitted."
