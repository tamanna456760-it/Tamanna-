# tamanna/bd-king-r7/it/
name: BD-KING-R7 AI Auto Build & Sync

on:
  push:
    branches: ["*"]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  auto:
    runs-on: tamanna

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    - name: Run Build Script
      run: |
        if [ -f build.py ]; then
          python build.py
        fi

    - name: Auto Commit Build
      run: |
        git config user.name "tamanna456760-it"
        git config user.email "tamanna456760@gmail.com"
        git add .
        git commit -m "BD-KING-R7 Auto Build & Sync" || echo "No changes""bd-king-r7"
        git push || echo "Push failed"