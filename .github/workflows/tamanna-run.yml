name: Run Tamanna AI - Manual Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile application
        run: python -m compileall -q Main.py run_server.py tamanna_ai data modules
      - name: Run tests
        run: python -m pytest -q
      - name: Explain runtime boundary
        run: echo "CI validates code; it does not start a persistent production server or push code."
