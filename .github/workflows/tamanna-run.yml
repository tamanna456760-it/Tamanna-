name: Tamanna Runtime Safety Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Main.py"
      - "main.py"
      - ".github/workflows/tamanna-run.yml"
permissions:
  contents: read
concurrency:
  group: tamanna-runtime-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application entry points
        run: python -m py_compile Main.py main.py
      - name: Report safe mode
        run: |
          echo "Entry-point syntax validation completed."
          echo "The application is not launched in CI."
          echo "No logs are committed and no repository push is performed."
