name: Tamanna Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-server.txt
            runner/python/requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server.txt
          python -m pip install -r runner/python/requirements.txt
          python -m pip install pytest

      - name: Compile Python modules
        run: |
          python -m compileall -q Main.py main.py tamanna_ai app_security data runner scripts tests

      - name: Run tests
        run: python -m pytest -q

      - name: Validate deployment configuration
        run: python deploy/preflight.py

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Build production container image
        run: docker build --tag tamanna-ai:ci .
