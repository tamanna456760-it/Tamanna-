name: Auto Build & Test (Advanced)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_linting:
        description: 'Run linting & formatting checks'
        type: boolean
        default: true
      run_security:
        description: 'Run security scanner (bandit)'
        type: boolean
        default: true

# Cancel in-progress runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # test all versions even if one fails
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          - python-version: "3.11"
            is_coverage: true   # only run coverage on one version

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist

      - name: 🔍 Lint & Format (only on primary version)
        if: matrix.python-version == '3.11' && github.event.inputs.run_linting != 'false'
        run: |
          pip install flake8 black
          black --check . || true
          flake8 . --count --show-source --statistics

      - name: 🔒 Security Scan (bandit)
        if: matrix.python-version == '3.11' && github.event.inputs.run_security != 'false'
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-report.json || true

      - name: 🧪 Run Tests with Coverage
        run: |
          if [ "${{ matrix.is_coverage }}" = "true" ]; then
            pytest -q --cov=. --cov-report=xml --cov-report=html --cov-report=term
          else
            pytest -q -n auto   # parallel tests
          fi

      - name: 📤 Upload coverage report
        if: matrix.is_coverage == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

      - name: 📤 Upload security report
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 7

  build:
    name: Build Distribution Package
    runs-on: ubuntu-latest
    needs: test   # only build if tests pass
    if: success() && github.event_name != 'pull_request'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install build tools
        run: |
          pip install build twine

      - name: 🏗️ Build package
        run: python -m build

      - name: 📤 Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 14

      - name: 🔍 Check package metadata
        run: twine check dist/*

  # Optional: publish to TestPyPI or PyPI on tag
  publish:
    name: Publish to PyPI (on tag)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    environment:
      name: pypi
      url: https://pypi.org/p/<your-package-name>
    permissions:
      id-token: write   # required for trusted publishing

    steps:
      - name: 📥 Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Use trusted publishing – no token needed if configured
          # Otherwise set PYPI_API_TOKEN secret
          password: ${{ secrets.PYPI_API_TOKEN || '' }}

  # Generate final summary
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()
    steps:
      - name: 📊 Create job summary
        run: |
          echo "## 🚀 Build & Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Test matrix**: Python 3.9–3.12" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests passed**: ${{ needs.test.result == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build succeeded**: ${{ needs.build.result == 'success' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          if github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'); then
            echo "- **Publishing**: ${{ needs.publish.result == 'success' && '✅ Published to PyPI' || '❌ Not published' }}" >> $GITHUB_STEP_SUMMARY
          fi