name: Tamanna AI Build and Test
on:
  push:
    branches: [main]
    paths: ["**.py", "requirements*.txt", "tests/**", ".github/workflows/auto_bulde.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tamanna-build-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-server.txt
      - name: Install server and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server.txt pytest
      - name: Check Python syntax without modifying source
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          excluded = {".git", ".venv", "venv", "node_modules", "__pycache__"}
          errors = []
          count = 0
          for path in Path(".").rglob("*.py"):
              if any(part in excluded for part in path.parts):
                  continue
              count += 1
              try:
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              except (OSError, UnicodeError, SyntaxError) as exc:
                  errors.append(f"{path}: {exc}")
          print(f"Python files checked: {count}")
          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          PY
      - name: Run tests when present
        run: |
          if [ -d tests ]; then
            python -m pytest -q tests
          else
            echo "No tests directory; skipped."
          fi
      - name: Validate deployment configuration
        run: python deploy/validate_deployment.py
      - name: Safety boundary
        run: echo "No package publishing, source rewrite, git commit, or push was performed."
