name: Tamanna AI Shell CI

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/tamanna-shell-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/tamanna-shell-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tamanna-shell-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-check:
    name: Safe Linux shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run read-only shell checks
        run: bash scripts/ci-shell-check.sh
