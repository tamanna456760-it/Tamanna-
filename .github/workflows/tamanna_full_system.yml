name: Tamanna Full System Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 0"

permissions:
  contents: read

concurrency:
  group: tamanna-full-system-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit dependency
        run: python -m pip install "PyYAML>=6.0.1,<7.0.0"

      - name: Run read-only full system audit
        run: python scripts/tamanna_full_audit.py

      - name: Validate workflow inventory
        run: python scripts/audit_workflows.py

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-full-system-audit
          path: |
            reports/tamanna_full_audit.json
            workflow-audit-report.json
          if-no-files-found: warn
          retention-days: 14
