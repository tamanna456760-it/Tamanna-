name: Tamanna Full System Audit - Manual Read-Only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tamanna-full-system-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python, JSON, and YAML files without rewriting
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python - <<'PY'
          import ast
          import json
          from pathlib import Path
          import yaml
          excluded = {".git", ".venv", "venv", "node_modules", "__pycache__", "backup"}
          errors, counts = [], {"python": 0, "json": 0, "yaml": 0}
          for path in Path(".").rglob("*"):
              if any(part in excluded for part in path.parts) or not path.is_file():
                  continue
              try:
                  if path.suffix == ".py":
                      ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
                      counts["python"] += 1
                  elif path.suffix == ".json":
                      json.loads(path.read_text(encoding="utf-8"))
                      counts["json"] += 1
                  elif path.suffix in {".yml", ".yaml"}:
                      list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
                      counts["yaml"] += 1
              except Exception as exc:
                  errors.append(f"{path}: {exc}")
          print("Files checked:", counts)
          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          print("PASS: syntax and structured-data checks")
          PY
      - name: Safety boundary
        run: echo "No periodic schedule, backup, security log write, source rewrite, commit, push, or deployment."
