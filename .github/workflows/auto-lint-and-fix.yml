
name: Tamanna Code Quality

on:
  push:
    branches: [main, develop]
    paths:
      - "**.py"
      - "**.js"
      - "**.sh"
      - ".github/workflows/auto-lint-and-fix.yml"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint without overwriting project files
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 black isort pylint

      - name: Python syntax check
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          skip = {".git", ".venv", "venv", "node_modules", "__pycache__"}
          errors = []

          for path in Path(".").rglob("*.py"):
              if any(part in skip for part in path.parts):
                  continue
              try:
                  ast.parse(path.read_text(encoding="utf-8"))
              except (SyntaxError, UnicodeDecodeError) as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)

          print("PASS: All scanned Python files parse successfully.")
          PY

      - name: Run Flake8
        continue-on-error: true
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            > flake8_critical.txt 2>&1

      - name: Check Black formatting
        continue-on-error: true
        run: |
          black --check . \
            --exclude '(^|/)(\.git|\.venv|venv|node_modules|__pycache__)/' \
            > black_check.txt 2>&1

      - name: Check import sorting
        continue-on-error: true
        run: |
          isort . \
            --check-only \
            --skip .git \
            --skip .venv \
            --skip venv \
            --skip node_modules \
            > isort_check.txt 2>&1

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamanna-lint-reports
          path: |
            flake8_critical.txt
            black_check.txt
            isort_check.txt
          if-no-files-found: ignore
          retention-days: 14
