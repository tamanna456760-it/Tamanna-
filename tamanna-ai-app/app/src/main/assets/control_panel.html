<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tamanna AI Panel</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            text-align: center;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            width: 80%;
        }
        #chat {
            height: 200px;
            overflow-y: auto;
            background: #020617;
        }
    </style>
</head>
<body>

<h2>🤖 Tamanna AI Panel</h2>

<div id="chat"></div>

<input type="text" id="msg" placeholder="Type message...">
<br>
<button onclick="send()">Send</button>

<script>
function log(text){
    let chat = document.getElementById("chat");
    chat.innerHTML += "<p>" + text + "</p>";
}

function send(){
    let msg = document.getElementById("msg").value;
    log("You: " + msg);

    // Android bridge (future connect)
    if(window.Android){
        let reply = Android.sendMessage(msg);
        log("AI: " + reply);
    } else {
        log("AI: (not connected)");
    }

    document.getElementById("msg").value = "";
}
</script>

</body>
</html>
