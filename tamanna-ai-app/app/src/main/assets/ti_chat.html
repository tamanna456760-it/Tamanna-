<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TI AI - Intelligent Chat</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0f172a;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;}
        .chat-container{width:100%;max-width:500px;background:#1e293b;border-radius:2rem;overflow:hidden;box-shadow:0 20px 35px -10px black;}
        .header{background:#0f172a;padding:1rem;text-align:center;color:white;font-weight:bold;font-size:1.4rem;}
        .messages{height:500px;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:0.8rem;}
        .user-msg,.bot-msg{display:flex;gap:8px;max-width:85%;animation:fadeIn 0.2s;}
        .user-msg{align-self:flex-end;flex-direction:row-reverse;}
        .bot-msg{align-self:flex-start;}
        .bubble{padding:0.6rem 1rem;border-radius:1rem;color:white;}
        .user-msg .bubble{background:#3b82f6;}
        .bot-msg .bubble{background:#334155;}
        .time{font-size:0.6rem;opacity:0.7;margin-top:4px;display:block;}
        .input-area{display:flex;padding:1rem;background:#0f172a;gap:8px;}
        .input-area input{flex:1;padding:0.7rem;border-radius:2rem;border:none;outline:none;background:#1e293b;color:white;}
        .input-area button{background:#8b5cf6;border:none;border-radius:2rem;padding:0.7rem 1.2rem;color:white;cursor:pointer;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
    </style>
</head>
<body>
<div class="chat-container">
    <div class="header">🤖 TI AI - Turing Intelligence</div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Ask TI anything...">
        <button id="sendBtn">Send</button>
    </div>
</div>
<script>
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(sender, text) {
        const div = document.createElement('div');
        div.className = sender === 'user' ? 'user-msg' : 'bot-msg';
        const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        div.innerHTML = `<div class="bubble">${escapeHtml(text)}<span class="time">${time}</span></div>`;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }
    // TI Bot logic - নতুন ফিচার এখানে যোগ করুন (সহজ উপায়)
    function tiReply(msg) {
        const lower = msg.toLowerCase();
        if(lower.includes('hello')||lower.includes('hi')) return "Hello! I'm TI. How can I help?";
        if(lower.includes('how are you')) return "I'm running perfectly, thanks!";
        if(lower.includes('joke')) return getRandomJoke();
        if(lower.includes('your name')) return "I'm TI – Turing Intelligence.";
        if(lower.includes('help')) return "আমি বলতে পারি: joke, weather, news, quote, math. তুমি চাইলে আরও ফিচার যোগ করতে পারো।";
        if(lower.includes('weather')) return "🌦️ Weather feature: API যোগ করে দিতে পারি। আপাতত ডেমো: Sunny 25°C";
        if(lower.includes('news')) return "📰 News: সংবাদ দেখতে API লাগবে। তুমি পরে যোগ করতে পারো।";
        if(lower.includes('quote')) return "💡 'Believe you can and you're halfway there.' – Theodore Roosevelt";
        if(lower.includes('math')) return handleMath(msg);
        return "Interesting. You can teach me new things by editing tiReply() function inside HTML.";
    }
    function getRandomJoke() {
        const jokes = ["Why don't scientists trust atoms? Because they make up everything!",
                       "What do you call a fake noodle? An impasta!",
                       "Why did the AI go to art school? To draw better conclusions."];
        return jokes[Math.floor(Math.random() * jokes.length)];
    }
    function handleMath(expr) {
        let numbers = expr.match(/\d+/g);
        if(numbers && numbers.length >= 2) {
            let a = parseInt(numbers[0]), b = parseInt(numbers[1]);
            return `🧮 ${a} + ${b} = ${a+b}`;
        }
        return "দুটি সংখ্যা দিন, যেমন: math 5 10";
    }
    async function sendMessage() {
        const text = input.value.trim();
        if(!text) return;
        addMessage('user', text);
        input.value = '';
        addMessage('bot', 'TI is thinking...');
        setTimeout(() => {
            messagesDiv.lastChild.remove();
            const reply = tiReply(text);
            addMessage('bot', reply);
        }, 600);
    }
    sendBtn.onclick = sendMessage;
    input.onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };
    addMessage('bot', "👋 Namaste! I'm TI AI. Ask anything.");
</script>
</body>
</html>
