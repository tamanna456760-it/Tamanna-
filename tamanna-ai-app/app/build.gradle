plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.tamanna.ai"
    compileSdk 34

    sourceSets {
        main {
            // Keep legacy experimental modules in the repository without compiling
            // them into the production launcher until each module has its own tests.
            java.setSrcDirs(["src/build/java"])
        }
    }

    defaultConfig {
        applicationId "com.tamanna.ai"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}