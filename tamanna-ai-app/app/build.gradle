plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseSigningEnv = [
    storeFile: System.getenv("TAMANNA_RELEASE_STORE_FILE"),
    storePassword: System.getenv("TAMANNA_RELEASE_STORE_PASSWORD"),
    keyAlias: System.getenv("TAMANNA_RELEASE_KEY_ALIAS"),
    keyPassword: System.getenv("TAMANNA_RELEASE_KEY_PASSWORD")
]
def configuredSigningValues = releaseSigningEnv.values().count { it != null && !it.trim().isEmpty() }
if (configuredSigningValues != 0 && configuredSigningValues != releaseSigningEnv.size()) {
    throw new GradleException("Release signing is partially configured. Set all four TAMANNA_RELEASE_* variables or none.")
}
def hasReleaseSigning = configuredSigningValues == releaseSigningEnv.size()

android {
    namespace "com.tamanna.ai"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main {
            // Keep legacy experimental modules in the repository without compiling
            // them into the production launcher until each module has its own tests.
            java.setSrcDirs(["src/build/java"])
        }
    }

    defaultConfig {
        applicationId "com.tamanna.ai"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseSigningEnv.storeFile)
                storePassword releaseSigningEnv.storePassword
                keyAlias releaseSigningEnv.keyAlias
                keyPassword releaseSigningEnv.keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
