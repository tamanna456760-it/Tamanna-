<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TI Chat</title>
    <script>
        // Function to execute JavaScript code
        function executeCode() {
            const code = document.getElementById('codeInput').value;
            try {
                eval(code);
            } catch (error) {
                console.error('Error executing code:', error);
                alert('Error executing code: ' + error.message);
            }
        }

        // Function to explain code
        function explainCode() {
            const code = document.getElementById('codeInput').value;
            // Placeholder for explanation logic
            alert('Code explanation feature is under development.');
        }

        // Code learning capabilities would be dynamic and context-based based on code input.
    </script>
</head>
<body>
    <h1>TI AI Bot</h1>
    <textarea id="codeInput" rows="10" cols="50" placeholder="Enter your JavaScript code here..."></textarea>
    <br>
    <button onclick="executeCode()">Execute Code</button>
    <button onclick="explainCode()">Explain Code</button>
</body>
</html>
