[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "tamanna-ai-ids"
version = "1.0.0"
description = "Tamanna AI Intrusion Detection System - monitor-only security monitoring"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "HM INSAN ALI" }
]
dependencies = []
[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0"
]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "*/__pycache__/*"
]
[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70