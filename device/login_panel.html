<!DOCTYPE html>
<html>
<head>
  <title>Login Sync System</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>
</head>

<body style="background:black; color:#0f0; font-family:monospace; padding:20px;">

<h2>💀 LOGIN PANEL 💀</h2>

<input type="email" id="email" placeholder="Email"><br><br>
<input type="password" id="password" placeholder="Password"><br><br>

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

<h3 id="status"></h3>

<script>
  // 🔥 তোমার Firebase config বসাও এখানে
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT.firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "XXXX",
    appId: "XXXX"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.database();

  function register() {
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    auth.createUserWithEmailAndPassword(email, password)
      .then(user => {
        document.getElementById("status").innerText = "Registered ✅";
      })
      .catch(err => alert(err.message));
  }

  function login() {
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    auth.signInWithEmailAndPassword(email, password)
      .then(user => {
        document.getElementById("status").innerText = "Login Success ✅";

        // Save device info
        let userId = user.user.uid;

        db.ref("users/" + userId).set({
          email: email,
          device: navigator.userAgent,
          time: new Date().toString()
        });
      })
      .catch(err => alert(err.message));
  }
</script>

</body>
</html>
