<!DOCTYPE html>
<html>
<head>
  <title>MAC Sync System</title>
</head>
<body style="background:black; color:#0f0; font-family:monospace; padding:20px;">

<h2>💀 MAC SYNC SYSTEM 💀</h2>

<p id="deviceID">Generating ID...</p>

<script>
  function generateID() {
    let id = localStorage.getItem("device_id");

    if (!id) {
      id = 'ID-' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem("device_id", id);
    }

    document.getElementById("deviceID").innerText =
      "Device ID: " + id;
  }

  generateID();
</script>

</body>
</html>
