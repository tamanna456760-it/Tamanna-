<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<title>Sentinel Eyes - Interactive Robot</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

		body {
			margin: 0;
			overflow: hidden;
			background-color: #050505;
			font-family: 'Rajdhani', sans-serif;
			touch-action: none;
			cursor: crosshair;
		}

		.scanlines {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: linear-gradient(
				to bottom,
				rgba(255,255,255,0),
				rgba(255,255,255,0) 50%,
				rgba(0,0,0,0.2) 50%,
				rgba(0,0,0,0.2)
			);
			background-size: 100% 4px;
			pointer-events: none;
			z-index: 50;
			opacity: 0.6;
		}

		.vignette {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.8) 100%);
			pointer-events: none;
			z-index: 51;
		}

		.hud-text {
			font-family: 'Orbitron', sans-serif;
			text-shadow: 0 0 5px currentColor;
		}

		.blink {
			animation: blinker 2s linear infinite;
		}

		@keyframes blinker {
			50% { opacity: 0.3; }
		}

		#robot-container {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			width: 320px;
			height: 280px;
			z-index: 10;
			transition: transform 0.1s ease-out;
		}

		.robot-part {
			transition: fill 0.3s ease;
		}
		
		.eye-glow {
			filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.8));
			transition: all 0.1s ease;
		}

		.eye-lid {
			transition: d 0.1s ease;
		}

		#bg-canvas {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 1;
		}

		#ui-layer {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: 40;
			pointer-events: none;
		}

		.corner-box {
			position: absolute;
			width: 100px;
			height: 100px;
			border: 1px solid rgba(0, 255, 255, 0.3);
		}
		.tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
		.tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
		.bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
		.br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

		.ripple {
			position: absolute;
			border-radius: 50%;
			border: 2px solid rgba(0, 255, 255, 0.5);
			transform: scale(0);
			animation: ripple-anim 0.6s linear;
			pointer-events: none;
			z-index: 30;
		}

		@keyframes ripple-anim {
			to { transform: scale(4); opacity: 0; }
		}

		@media (max-width: 640px) {
			#robot-container {
				width: 280px;
				height: 240px;
			}
		}
	</style>
</head>
<body>

	<canvas id="bg-canvas"></canvas>

	<div class="scanlines"></div>
	<div class="vignette"></div>

	<div id="ui-layer" class="flex flex-col justify-between p-6">
		<div class="flex justify-between items-start w-full">
			<div class="text-cyan-400">
				<h1 class="text-2xl font-bold hud-text tracking-widest">SENTINEL<span class="text-white text-sm align-top opacity-70">v9.2</span></h1>
				<div class="flex items-center gap-2 mt-1">
					<div class="w-2 h-2 bg-green-500 rounded-full blink"></div>
					<span class="text-xs text-cyan-200 tracking-wider opacity-80">SYSTEM ONLINE</span>
				</div>
			</div>
			<div class="text-right text-cyan-400">
				<div class="text-xs font-mono opacity-70" id="clock">00:00:00</div>
				<div class="text-xs font-mono text-red-400 mt-1" id="threat-level">THREAT: NONE</div>
			</div>
		</div>

		<div class="corner-box tl"></div>
		<div class="corner-box tr"></div>
		<div class="corner-box bl"></div>
		<div class="corner-box br"></div>

		<div class="flex justify-between items-end w-full">
			<div class="text-cyan-600 font-mono text-xs">
				<div>CPU: <span id="cpu-stat">12</span>%</div>
				<div>MEM: <span id="mem-stat">45</span>%</div>
				<div class="w-32 h-1 bg-gray-800 mt-1 rounded overflow-hidden">
					<div id="energy-bar" class="h-full bg-cyan-400 w-3/4 transition-all duration-300"></div>
				</div>
			</div>
			<div class="text-cyan-600 font-mono text-xs text-right">
				<div>TARGET LOCK: <span id="target-status" class="text-red-500">SEARCHING...</span></div>
				<div>COORDS: <span id="coords">X:000 Y:000</span></div>
			</div>
		</div>
	</div>

	<div id="robot-container">
		<svg viewBox="0 0 240 160" class="w-full h-full drop-shadow-2xl">
			<!-- Antenna -->
			<line x1="120" y1="20" x2="120" y2="5" stroke="#334155" stroke-width="3" />
			<circle cx="120" cy="5" r="3" fill="#ef4444" class="blink" />
			
			<!-- Head Shape -->
			<path d="M30,40 Q30,25 50,25 L190,25 Q210,25 210,40 L210,100 Q210,130 180,130 L60,130 Q30,130 30,100 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
			
			<!-- Side Ears -->
			<rect x="20" y="55" width="10" height="35" rx="2" fill="#1e293b" />
			<rect x="210" y="55" width="10" height="35" rx="2" fill="#1e293b" />

			<!-- LEFT EYE -->
			<g id="left-eye-group">
				<defs>
					<clipPath id="left-eye-clip">
						<rect x="50" y="50" width="60" height="45" rx="8" />
					</clipPath>
				</defs>
				<!-- Socket Background -->
				<rect x="50" y="50" width="60" height="45" rx="8" fill="#000" stroke="#06b6d4" stroke-width="2" />
				<!-- Moving Parts -->
				<g clip-path="url(#left-eye-clip)">
					<circle id="left-iris" cx="80" cy="72" r="14" fill="#06b6d4" class="eye-glow" />
					<circle id="left-pupil" cx="80" cy="72" r="6" fill="#000" />
					<circle id="left-highlight" cx="84" cy="68" r="3" fill="#fff" opacity="0.8" />
				</g>
				<!-- Lids -->
				<path id="left-upper-lid" d="M50,50 L110,50 L110,35 L50,35 Z" fill="#0f172a" class="eye-lid" />
				<path id="left-lower-lid" d="M50,95 L110,95 L110,110 L50,110 Z" fill="#0f172a" class="eye-lid" />
			</g>

			<!-- RIGHT EYE -->
			<g id="right-eye-group">
				<defs>
					<clipPath id="right-eye-clip">
						<rect x="130" y="50" width="60" height="45" rx="8" />
					</clipPath>
				</defs>
				<!-- Socket Background -->
				<rect x="130" y="50" width="60" height="45" rx="8" fill="#000" stroke="#06b6d4" stroke-width="2" />
				<!-- Moving Parts -->
				<g clip-path="url(#right-eye-clip)">
					<circle id="right-iris" cx="160" cy="72" r="14" fill="#06b6d4" class="eye-glow" />
					<circle id="right-pupil" cx="160" cy="72" r="6" fill="#000" />
					<circle id="right-highlight" cx="164" cy="68" r="3" fill="#fff" opacity="0.8" />
				</g>
				<!-- Lids -->
				<path id="right-upper-lid" d="M130,50 L190,50 L190,35 L130,35 Z" fill="#0f172a" class="eye-lid" />
				<path id="right-lower-lid" d="M130,95 L190,95 L190,110 L130,110 Z" fill="#0f172a" class="eye-lid" />
			</g>

			<!-- Mouth -->
			<g transform="translate(90, 115)">
				<rect x="0" y="0" width="60" height="3" rx="1.5" fill="#334155" />
				<rect x="15" y="8" width="30" height="3" rx="1.5" fill="#334155" />
			</g>
		</svg>
	</div>

	<script>
		const CONFIG = {
			eyeRadiusX: 16,
			eyeRadiusY: 12,
			smoothing: 0.12,
			colors: {
				calm: '#06b6d4',
				alert: '#ef4444',
				scan: '#22c55e'
			}
		};

		const state = {
			mouseX: window.innerWidth / 2,
			mouseY: window.innerHeight / 2,
			targetX: 0,
			targetY: 0,
			currentX: 0,
			currentY: 0,
			isTouching: false,
			blinkTimer: null,
			energy: 75
		};

		const els = {
			leftIris: document.getElementById('left-iris'),
			leftPupil: document.getElementById('left-pupil'),
			leftHighlight: document.getElementById('left-highlight'),
			leftUpperLid: document.getElementById('left-upper-lid'),
			leftLowerLid: document.getElementById('left-lower-lid'),
			
			rightIris: document.getElementById('right-iris'),
			rightPupil: document.getElementById('right-pupil'),
			rightHighlight: document.getElementById('right-highlight'),
			rightUpperLid: document.getElementById('right-upper-lid'),
			rightLowerLid: document.getElementById('right-lower-lid'),
			
			robotContainer: document.getElementById('robot-container'),
			coords: document.getElementById('coords'),
			targetStatus: document.getElementById('target-status'),
			threatLevel: document.getElementById('threat-level'),
			energyBar: document.getElementById('energy-bar'),
			bgCanvas: document.getElementById('bg-canvas')
		};

		const EYE_CENTERS = {
			left: { x: 80, y: 72 },
			right: { x: 160, y: 72 }
		};

		function init() {
			setupEventListeners();
			startBlinkLoop();
			requestAnimationFrame(animate);
			updateClock();
			setInterval(updateClock, 1000);
			setInterval(randomizeStats, 2000);
			initBackground();
		}

		function setupEventListeners() {
			window.addEventListener('mousemove', (e) => {
				state.isTouching = false;
				updateTarget(e.clientX, e.clientY);
			});

			window.addEventListener('touchmove', (e) => {
				e.preventDefault();
				state.isTouching = true;
				const touch = e.touches[0];
				updateTarget(touch.clientX, touch.clientY);
				createRipple(touch.clientX, touch.clientY);
			}, { passive: false });

			window.addEventListener('touchstart', (e) => {
				state.isTouching = true;
				const touch = e.touches[0];
				updateTarget(touch.clientX, touch.clientY);
				createRipple(touch.clientX, touch.clientY);
				els.targetStatus.innerText = "LOCKED";
				els.targetStatus.className = "text-red-500 font-bold blink";
				els.threatLevel.innerText = "THREAT: DETECTED";
				els.threatLevel.className = "text-red-500 font-bold";
				setEyeColor(CONFIG.colors.alert);
			});

			window.addEventListener('touchend', () => {
				state.isTouching = false;
				els.targetStatus.innerText = "SEARCHING...";
				els.targetStatus.className = "text-cyan-500";
				els.threatLevel.innerText = "THREAT: NONE";
				els.threatLevel.className = "";
				setEyeColor(CONFIG.colors.calm);
			});
			
			window.addEventListener('mousedown', (e) => {
				createRipple(e.clientX, e.clientY);
				blink();
			});
		}

		function updateTarget(x, y) {
			state.mouseX = x;
			state.mouseY = y;
			els.coords.innerText = `X:${String(Math.floor(x)).padStart(3, '0')} Y:${String(Math.floor(y)).padStart(3, '0')}`;
		}

		function setEyeColor(color) {
			[els.leftIris, els.rightIris].forEach(iris => {
				iris.style.fill = color;
				iris.style.filter = `drop-shadow(0 0 8px ${color})`;
			});
		}

		function calculateEyePosition() {
			const rect = els.robotContainer.getBoundingClientRect();
			const robotCenterX = rect.left + rect.width / 2;
			const robotCenterY = rect.top + rect.height / 2;

			const dx = state.mouseX - robotCenterX;
			const dy = state.mouseY - robotCenterY;

			const angle = Math.atan2(dy, dx);
			const screenDist = Math.hypot(dx, dy);
			
			const maxScreenDist = 300;
			const normalizedDist = Math.min(screenDist, maxScreenDist) / maxScreenDist;
			
			const moveX = Math.cos(angle) * normalizedDist * CONFIG.eyeRadiusX;
			const moveY = Math.sin(angle) * normalizedDist * CONFIG.eyeRadiusY;

			state.targetX = moveX;
			state.targetY = moveY;
		}

		function updateEyeElements() {
			state.currentX += (state.targetX - state.currentX) * CONFIG.smoothing;
			state.currentY += (state.targetY - state.currentY) * CONFIG.smoothing;

			['left', 'right'].forEach(side => {
				const center = EYE_CENTERS[side];
				const irisX = center.x + state.currentX;
				const irisY = center.y + state.currentY;
				
				const iris = side === 'left' ? els.leftIris : els.rightIris;
				const pupil = side === 'left' ? els.leftPupil : els.rightPupil;
				const highlight = side === 'left' ? els.leftHighlight : els.rightHighlight;

				iris.setAttribute('cx', irisX);
				iris.setAttribute('cy', irisY);
				
				pupil.setAttribute('cx', irisX);
				pupil.setAttribute('cy', irisY);

				highlight.setAttribute('cx', irisX + 3);
				highlight.setAttribute('cy', irisY - 3);
			});

			const centerX = window.innerWidth / 2;
			const centerY = window.innerHeight / 2;
			const tiltX = (state.mouseY - centerY) / 60;
			const tiltY = (state.mouseX - centerX) / 60;
			
			els.robotContainer.style.transform = `translate(-50%, -50%) perspective(1000px) rotateX(${-tiltX}deg) rotateY(${tiltY}deg)`;
		}

		function animate() {
			calculateEyePosition();
			updateEyeElements();
			drawBackground();
			requestAnimationFrame(animate);
		}

		function blink() {
			const upperY = 72;
			const lowerY = 72;
			
			[els.leftUpperLid, els.rightUpperLid].forEach(lid => {
				lid.setAttribute('d', lid.id.includes('left') ? 
					`M50,50 L110,50 L110,${upperY} L50,${upperY} Z` : 
					`M130,50 L190,50 L190,${upperY} L130,${upperY} Z`);
			});
			
			[els.leftLowerLid, els.rightLowerLid].forEach(lid => {
				lid.setAttribute('d', lid.id.includes('left') ? 
					`M50,95 L110,95 L110,${lowerY} L50,${lowerY} Z` : 
					`M130,95 L190,95 L190,${lowerY} L130,${lowerY} Z`);
			});

			setTimeout(() => {
				els.leftUpperLid.setAttribute('d', 'M50,50 L110,50 L110,35 L50,35 Z');
				els.leftLowerLid.setAttribute('d', 'M50,95 L110,95 L110,110 L50,110 Z');
				els.rightUpperLid.setAttribute('d', 'M130,50 L190,50 L190,35 L130,35 Z');
				els.rightLowerLid.setAttribute('d', 'M130,95 L190,95 L190,110 L130,110 Z');
			}, 150);
		}

		function startBlinkLoop() {
			const loop = () => {
				const delay = Math.random() * 3000 + 2000;
				setTimeout(() => {
					if (!state.isTouching) blink();
					loop();
				}, delay);
			};
			loop();
		}

		function createRipple(x, y) {
			const ripple = document.createElement('div');
			ripple.className = 'ripple';
			ripple.style.left = (x - 10) + 'px';
			ripple.style.top = (y - 10) + 'px';
			document.body.appendChild(ripple);
			setTimeout(() => ripple.remove(), 600);
		}

		function updateClock() {
			const now = new Date();
			document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour12: false });
		}

		function randomizeStats() {
			document.getElementById('cpu-stat').innerText = Math.floor(Math.random() * 30) + 10;
			document.getElementById('mem-stat').innerText = Math.floor(Math.random() * 20) + 40;
			
			state.energy += Math.random() > 0.5 ? 1 : -1;
			state.energy = Math.max(20, Math.min(100, state.energy));
			els.energyBar.style.width = state.energy + '%';
			
			if (state.energy < 30) els.energyBar.classList.replace('bg-cyan-400', 'bg-red-500');
			else els.energyBar.classList.replace('bg-red-500', 'bg-cyan-400');
		}

		let ctx;
		let gridOffset = 0;

		function initBackground() {
			els.bgCanvas.width = window.innerWidth;
			els.bgCanvas.height = window.innerHeight;
			ctx = els.bgCanvas.getContext('2d');
			
			window.addEventListener('resize', () => {
				els.bgCanvas.width = window.innerWidth;
				els.bgCanvas.height = window.innerHeight;
			});
		}

		function drawBackground() {
			if (!ctx) return;
			const w = els.bgCanvas.width;
			const h = els.bgCanvas.height;

			ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
			ctx.fillRect(0, 0, w, h);

			ctx.strokeStyle = 'rgba(6, 182, 212, 0.15)';
			ctx.lineWidth = 1;

			const gridSize = 40;
			const speed = 0.5;
			
			for (let x = 0; x <= w; x += gridSize) {
				ctx.beginPath();
				ctx.moveTo(x, 0);
				ctx.lineTo(x, h);
				ctx.stroke();
			}

			gridOffset = (gridOffset + speed) % gridSize;
			
			for (let y = gridOffset; y <= h; y += gridSize) {
				ctx.beginPath();
				ctx.moveTo(0, y);
				ctx.lineTo(w, y);
				ctx.stroke();
			}

			ctx.fillStyle = '#fff';
			for (let i = 0; i < 5; i++) {
				if (Math.random() > 0.95) {
					const x = Math.random() * w;
					const y = Math.random() * h;
					ctx.fillRect(x, y, 2, 2);
				}
			}
		}

		init();
	</script>
</body>
</html>
