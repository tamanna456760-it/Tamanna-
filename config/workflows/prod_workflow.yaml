# config/workflows/prod_workflow.yaml
name: "Production Build Pipeline"
description: "Production build with quality gates"

triggers:
  - git_tag: "v*"
  - manual: true

sync:
  environments: ["staging"]
  strategy: "verified"

build:
  languages: ["python", "docker"]
  tests: true
  security_scan: true
  quality_gates:
    - test_coverage: 80
    - security_issues: 0
    - performance_budget: "2s"

deployment:
  auto_deploy: false
  environment: "production"
  strategy: "blue-green"
  health_checks: true
  rollback: true