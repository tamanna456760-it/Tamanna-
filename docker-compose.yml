
services:
  tamanna-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tamanna-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      TAMANNA_MEMORY_FILE: /app/data/tamanna_memory.json
    volumes:
      - tamanna_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  tamanna_data:
