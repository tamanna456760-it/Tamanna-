services:
  tamanna-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tamanna-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      TAMANNA_DATABASE_URL: sqlite:////app/data/tamanna.sqlite3
      TAMANNA_AUTH_DB: /app/data/accounts.sqlite3
      TAMANNA_MAX_REQUEST_BYTES: "1048576"
    volumes:
      - tamanna_data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  tamanna_data:
