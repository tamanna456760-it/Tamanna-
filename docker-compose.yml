services:
  tamanna-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tamanna-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      TAMANNA_DATABASE_URL: sqlite:////app/data/tamanna.sqlite3
      TAMANNA_AUTH_DB: /app/data/accounts.sqlite3
      TAMANNA_MAX_REQUEST_BYTES: "1048576"
    volumes:
      - tamanna_data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  tor:
    build:
      context: .
      dockerfile: deploy/tor/Dockerfile
    container_name: tamanna-ai-tor
    restart: unless-stopped
    depends_on:
      tamanna-ai:
        condition: service_healthy
    volumes:
      - tamanna_tor_data:/var/lib/tor
    networks:
      - default
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/lib/tor/hidden_service/hostname"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  tamanna_data:
  tamanna_tor_data:
