<!DOCTYPE html>
<html>
<head>
<title>Advanced Auto Save System</title>
<style>
body { font-family: Arial; padding:20px; }
textarea { width:100%; height:80px; }
button { margin-top:10px; }
ul { margin-top:20px; padding:0; }
li {
  list-style:none;
  padding:10px;
  background:#f1f1f1;
  margin-bottom:5px;
  cursor:move;
}
</style>
</head>
<body>

<h2>Advanced Auto Save + Serial + Position Fix</h2>

<textarea id="textInput" placeholder="Type and auto save..."></textarea>
<button onclick="downloadFile()">Download File</button>

<ul id="dataList"></ul>

<script>
let data = JSON.parse(localStorage.getItem("autoData")) || [];
const input = document.getElementById("textInput");
const list = document.getElementById("dataList");
let timeout;

// Auto Save with Delay
input.addEventListener("input", () => {
  clearTimeout(timeout);
  timeout = setTimeout(() => {
    if(input.value.trim() !== ""){
      saveData(input.value.trim());
      input.value = "";
    }
  }, 1000);
});

function saveData(text){
  data.push({ content:text });
  fixSerial();
  saveLocal();
  render();
}

// Fix Serial Automatically
function fixSerial(){
  data.forEach((item, index) => {
    item.id = index + 1;
  });
}

// Save to LocalStorage
function saveLocal(){
  localStorage.setItem("autoData", JSON.stringify(data));
}

// Delete Item
function deleteItem(index){
  data.splice(index,1);
  fixSerial();
  saveLocal();
  render();
}

// Render List
function render(){
  list.innerHTML = "";
  data.forEach((item,index) => {
    const li = document.createElement("li");
    li.draggable = true;
    li.innerHTML = item.id + ". " + item.content +
      " <button onclick='deleteItem("+index+")'>Delete</button>";

    li.addEventListener("dragstart", ()=> dragIndex=index);
    li.addEventListener("dragover", (e)=> e.preventDefault());
    li.addEventListener("drop", ()=> {
      const moved = data.splice(dragIndex,1)[0];
      data.splice(index,0,moved);
      fixSerial();
      saveLocal();
      render();
    });

    list.appendChild(li);
  });
}

// Download as JSON File
function downloadFile(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "autosave_data.json";
  a.click();
}

// Load on Start
fixSerial();
render();
</script>

</body>
</html>
