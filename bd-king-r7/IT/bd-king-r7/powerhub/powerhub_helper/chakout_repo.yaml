
name: "BD-KING-R7 PowerHub Build"

on:
  push:
    branches: [main]
    paths:
      - "bd-king-r7/IT/bd-king-r7/powerhub/**"
      - ".github/workflows/powerhub-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "bd-king-r7/IT/bd-king-r7/powerhub/**"
      - ".github/workflows/powerhub-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powerhub-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PowerHub
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            bd-king-r7/IT/bd-king-r7/powerhub/package-lock.json
            bd-king-r7/IT/bd-king-r7/powerhub/powerhub_helper/package-lock.json

      - name: Locate PowerHub Node.js project
        id: locate
        shell: bash
        run: |
          BASE="bd-king-r7/IT/bd-king-r7/powerhub"
          APP_DIR=""

          for candidate in "$BASE" "$BASE/powerhub_helper"; do
            if [ -f "$candidate/package.json" ]; then
              APP_DIR="$candidate"
              break
            fi
          done

          if [ -z "$APP_DIR" ]; then
            echo "ERROR: package.json not found in PowerHub directories."
            echo "Check where the actual Node.js application is stored."
            exit 1
          fi

          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "Using Node.js project: $APP_DIR"

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify build script
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.scripts || !p.scripts.build) {
              console.error('ERROR: package.json has no build script.');
              process.exit(1);
            }
            console.log('Build script found.');
          "

      - name: Build PowerHub
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: npm run build

      - name: Run tests when available
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: npm test --if-present

      - name: Verify build output
        working-directory: ${{ steps.locate.outputs.app_dir }}
        run: |
          if [ ! -d dist ]; then
            echo "ERROR: dist/ directory was not created."
            echo "Adjust the output path if this project uses another build directory."
            exit 1
          fi

          if [ -z "$(find dist -type f -print -quit)" ]; then
            echo "ERROR: dist/ contains no files."
            exit 1
          fi

          echo "Build output verified."
          find dist -maxdepth 3 -type f -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: powerhub-build-${{ github.run_id }}
          path: ${{ steps.locate.outputs.app_dir }}/dist/
          if-no-files-found: error
          retention-days: 14
