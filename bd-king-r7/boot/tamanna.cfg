menuentry "Tamanna Sovereign Boot" {
    insmod part_gpt
    insmod fat
    search --no-floppy --file /EFI/Tamanna/Tamanna.efi --set=root
    chainloader /EFI/Tamanna/Tamanna.efi
}
[NET-ROUTING]
    /boot        → core.boot
    /engine      → core.engine.dual
    /mirror      → core.engine.mirror
    /heartbeat   → core.heartbeat.loop
    /identity    → core.identity
    /power       → core.power
    /ficar       → ficar-power
    /ai          → ai-full-power
    /hub         → bd-king-r7.powerhub.link
    /ascii       → ascii-engine
    /version     → version-manifest
