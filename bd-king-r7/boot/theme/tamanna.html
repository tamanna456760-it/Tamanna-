<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uploaded Photo</title>
  <style>
    :root {
      --bg: #f7f7f9;
      --text: #222;
      --border: #ccccd6;
      --caption: #555;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .wrap {
      max-width: 920px;
      width: 100%;
      text-align: center;
    }

    figure {
      margin: 0;
    }

    img {
      width: 100%;
      height: auto;
      max-width: 820px;           /* keeps it nicely sized on large screens */
      display: block;
      margin: 0 auto;
      border: 3px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    figcaption {
      margin-top: 10px;
      font-size: 0.95rem;
      color: var(--caption);
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <figure>
      <!-- Replace the src with your file name if different -->
      <img src="fuTwP7SBtXBxPKLJWutBw.jpeg" alt="Uploaded photo in a landscaped area with pink flowers and palm tree." />
      <figcaption>Uploaded Photo</figcaption>
    </figure>
  </main>
</body>
</html>
