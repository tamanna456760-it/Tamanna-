<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Create Tamanna.png</title>
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #0e0f14;
        color: #fff;
        font-family: system-ui;
      }
      .card {
        padding: 20px;
        background: #1a1d29;
        border: 1px solid #2e3244;
        border-radius: 12px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      }
      canvas {
        display: block;
        margin: 12px auto;
        border-radius: 10px;
      }
      button {
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: #ff6ea8;
        color: #12131a;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #ff4f97;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Create Tamanna.png</h2>
      <canvas id="c" width="1200" height="675"></canvas>
      <button id="dl">Download tamanna.png</button>
    </div>

    <script>
      const c = document.getElementById("c");
      const ctx = c.getContext("2d");

      // Background gradient
      const g = ctx.createLinearGradient(0, 0, 0, c.height);
      g.addColorStop(0, "#1f1147");
      g.addColorStop(0.5, "#3a165f");
      g.addColorStop(1, "#0e0f14");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, c.width, c.height);

      // Soft aura
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc(c.width / 2, c.height / 2, 220 + i * 20, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 110, 168, ${0.08 - i * 0.01})`;
        ctx.fill();
      }

      // Heart glyph
      function heartPath(x, y, size) {
        const s = size;
        ctx.beginPath();
        ctx.moveTo(x, y + 0.3 * s);
        ctx.bezierCurveTo(
          x - 1.6 * s,
          y - 0.9 * s,
          x - 0.9 * s,
          y - 2.0 * s,
          x,
          y - 1.2 * s,
        );
        ctx.bezierCurveTo(
          x + 0.9 * s,
          y - 2.0 * s,
          x + 1.6 * s,
          y - 0.9 * s,
          x,
          y + 0.3 * s,
        );
        ctx.closePath();
      }

      ctx.save();
      ctx.translate(c.width / 2, c.height / 2);
      ctx.scale(1.1, 1.1);
      heartPath(0, 0, 90);
      const hGrad = ctx.createRadialGradient(0, -20, 10, 0, 0, 160);
      hGrad.addColorStop(0, "#ffb3cc");
      hGrad.addColorStop(0.5, "#ff6ea8");
      hGrad.addColorStop(1, "#ff2d86");
      ctx.fillStyle = hGrad;
      ctx.shadowColor = "rgba(255, 110, 168, 0.55)";
      ctx.shadowBlur = 40;
      ctx.fill();
      ctx.restore();

      // Title text
      ctx.font = '700 72px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.fillText("TAMANNA", c.width / 2, c.height / 2 + 180);

      // Subtitle (Bengali-coded vibe)
      ctx.font =
        '500 28px "Noto Sans Bengali", "Noto Sans", system-ui, sans-serif';
      ctx.fillStyle = "rgba(255,255,255,0.88)";
      ctx.fillText(
        "Emotion Engine • Sovereign Ritual",
        c.width / 2,
        c.height / 2 + 225,
      );

      // Download as PNG
      document.getElementById("dl").addEventListener("click", () => {
        const link = document.createElement("a");
        link.download = "tamanna.png";
        link.href = c.toDataURL("image/png");
        link.click();
      });
    </script>
  </body>
</html>
