<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tamanna Connection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: #020617;
            padding: 25px;
            border-radius: 10px;
            width: 320px;
            text-align: center;
            box-shadow: 0 0 15px #2563eb;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            border: none;
        }
        button {
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        .info {
            margin-top: 15px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Tamanna System</h2>

    <form action="mailto:tamanna456760@gmail.com" method="post" enctype="text/plain">
        <input type="text" name="username" value="tamanna456760-it" readonly>
        <input type="email" name="email" placeholder="Your Email" required>
        <input type="text" name="message" placeholder="Message" required>
        <button type="submit">Connect</button>
    </form>

    <div class="info">
        Connected to: <br>
        <b>tamanna456760@gmail.com</b>

</html>
