<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tamanna AI Chat — BD-KING-R7</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="chat-container">
      <h1>Tamanna AI Chat</h1>
      <div id="chatbox" class="chatbox"></div>

      <div class="chat-input">
        <input id="message" placeholder="Type your message..." />
        <button id="send">Send</button>
      </div>

      <div style="margin-top: 12px; font-size: 12px; color: #9f9f9f">
        <strong>Mode:</strong> <span id="mode">unknown</span>
      </div>
    </div>

    <script src="chat.js"></script>
  </body>
</html>
