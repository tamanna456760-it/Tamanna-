<!doctype html>
<html>
  <head>
    <title>BD-KING-R7 PowerHub</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>BD-KING-R7 PowerHub</h1>
    <p>Select a power mode:</p>

    <button onclick="getPower('normal')">Normal Power</button>
    <button onclick="getPower('medium')">Medium Power</button>
    <button onclick="getPower('deep')">Deep Power</button>
    <button onclick="getPower('dark')">Dark Power</button>
    <button onclick="getPower('underground')">Underground Power</button>
    <button onclick="getPower('silent')">Silent Supersonic</button>
    <button onclick="getPower('stone')">Stone Spirit Max</button>

    <pre id="output"></pre>

    <script>
      function getPower(type) {
        fetch(`/power/${type}`)
          .then((r) => r.json())
          .then(
            (d) =>
              (document.getElementById("output").textContent = JSON.stringify(
                d,
                null,
                2,
              )),
          );
      }
    </script>
  </body>
</html>
