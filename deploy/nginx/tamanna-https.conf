# =========================================================
# Tamanna AI — HTTPS / TLS Configuration
# Owner: HM INSAN ALI
# Domain: www.tamanna.com
#
# Requires valid TLS certificate and private key.
# Replace certificate paths to match your server.
# =========================================================
# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tamanna.com www.tamanna.com;
    return 301 https://www.tamanna.com$request_uri;
}
# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tamanna.com;
    # TLS certificate files
    ssl_certificate
        /etc/letsencrypt/live/www.tamanna.com/fullchain.pem;
    ssl_certificate_key
        /etc/letsencrypt/live/www.tamanna.com/privkey.pem;
    # Modern TLS protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:TamannaTLS:10m;
    ssl_session_timeout 1d;
    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Only enable HSTS after HTTPS is verified to work.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Reverse proxy to Tamanna AI application
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}