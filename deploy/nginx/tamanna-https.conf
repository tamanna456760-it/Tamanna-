# Tamanna AI — Production HTTPS Configuration
# Owner: HM INSAN ALI

# Per-client API throttling: 20 requests/second (1,200/minute),
# with a short burst allowance. Nginx conf.d files are loaded inside http{}.
limit_req_zone $binary_remote_addr zone=tamanna_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=tamanna_api_conn:10m;

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name tamanna.com www.tamanna.com;

    return 301 https://www.tamanna.com$request_uri;
}

# Redirect apex domain to www
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name tamanna.com;

    ssl_certificate
        /etc/letsencrypt/live/www.tamanna.com/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/www.tamanna.com/privkey.pem;

    return 301 https://www.tamanna.com$request_uri;
}

# Main Tamanna AI website and API
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    server_name www.tamanna.com;

    ssl_certificate
        /etc/letsencrypt/live/www.tamanna.com/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/www.tamanna.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TamannaTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API routes have per-client rate and connection limits.
    location ^~ /api/ {
        limit_req zone=tamanna_api burst=40 nodelay;
        limit_req_status 429;
        limit_conn tamanna_api_conn 20;

        proxy_pass http://tamanna-ai:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Website and static routes.
    location / {
        proxy_pass http://tamanna-ai:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
