# Tamanna AI — Production HTTPS Configuration
# Owner: HM INSAN ALI

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name bd-king-r7.com www.bd-king-r7.com;

    return 301 https://www.bd-king-r7.com$request_uri;
}

# Redirect apex domain to www
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name bd-king-r7.com;

    ssl_certificate
        /etc/letsencrypt/live/www.bd-king-r7.com/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/www.bd-king-r7.com/privkey.pem;

    return 301 https://www.bd-king-r7.com$request_uri;
}

# Main Tamanna AI website and API
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    server_name www.bd-king-r7.com;

    ssl_certificate
        /etc/letsencrypt/live/www.bd-king-r7.com/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/www.bd-king-r7.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TamannaTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamanna AI Docker service
    location / {
        proxy_pass http://tamanna-ai:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
