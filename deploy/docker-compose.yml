# =====================================================
# Tamanna AI — Deployment Configuration
# Owner: HM INSAN ALI
# Domain: www.tamanna.com
# =====================================================
services:
  tamanna-ai:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tamanna-ai
    restart: unless-stopped
    # Bind the application only to localhost; Nginx is the public entry point.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../.env
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      TAMANNA_ENV: "production"
      PYTHONUNBUFFERED: "1"
    volumes:
      # Keep the existing production data volume across container recreation.
      - tamanna-ai-data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - tamanna-network
    stop_grace_period: 30s

  nginx:
    image: nginx:stable
    container_name: tamanna-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      tamanna-ai:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - tamanna-network
    stop_grace_period: 15s

volumes:
  tamanna-ai-data:
    name: tamanna-ai-data

networks:
  tamanna-network:
    driver: bridge
