# Tamanna AI production deployment
# Run from the repository root:
# docker compose -f deploy/docker-compose.yml --env-file .env up -d --build

services:
  tamanna-ai:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tamanna-ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../.env
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      TAMANNA_ENV: "production"
      PYTHONUNBUFFERED: "1"
      TAMANNA_DATABASE_URL: sqlite:////app/data/tamanna.sqlite3
      TAMANNA_AUTH_DB: /app/data/accounts.sqlite3
      TAMANNA_MAX_REQUEST_BYTES: "1048576"
      TAMANNA_MODEL_PROVIDER: "ollama"
      TAMANNA_OLLAMA_URL: "http://ollama:11434"
      TAMANNA_OLLAMA_MODEL: "qwen2.5:7b"
    volumes:
      - tamanna_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    networks:
      - tamanna-network

  ollama:
    image: ollama/ollama:latest
    container_name: tamanna-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - tamanna-network

  nginx:
    image: nginx:stable
    container_name: tamanna-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      tamanna-ai:
        condition: service_healthy
    networks:
      - tamanna-network

networks:
  tamanna-network:
    driver: bridge

volumes:
  tamanna_data:
  ollama_data:
